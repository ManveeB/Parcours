 not embedded.')}<hr class="section-divider"><h3>Your authentic listening assignment</h3><p class="small muted">${esc(d.listening)}</p>${m.listenUrl?link(m.listenUrl,`<strong>${esc(m.listenTitle||'Your chosen audio/video')}</strong><p>Open the saved excerpt ${icon('external')}</p>`):''}${materialFields('listen')}${matchedResources(d.listening).map(resourceCard).join('')||resourceCard(CURRICULUM.resources.find(r=>r.id==='R2'))}<div class="mt">${completion('listening')}</div></section><div class="stack"><section class="card"><h2>Three passes, one short excerpt.</h2><div class="tutor-agenda mt"><div class="agenda-item"><span class="number">1</span><div><strong>The main message</strong><p>Who is speaking? What is happening? What does the person want?</p></div></div><div class="agenda-item"><span class="number">2</span><div><strong>Three useful details</strong><p>Listen again without text. Write the details you understand.</p></div></div><div class="agenda-item"><span class="number">3</span><div><strong>Check, repeat, summarise</strong><p>Read the transcript. Repeat 30–60 seconds, then give a short summary.</p></div></div></div><div class="mt">${textarea('listeningNotes','Main message, three details and a short summary…','',6)}</div></section><section class="card"><h3>What made listening difficult?</h3><p class="small muted">A new word? A familiar word you did not recognise? Linked words that sounded like one? Give your teacher an example.</p>${textarea('decoding','Write the phrase you missed and what you heard…','',3)}</section></div></div>`;}
 return heading('French worth understanding.','Focused reading and listening, connected to the day’s situation.')+mediaPromo()+`<div class="tabs" role="tablist" aria-label="Library sections">${[['read','Read'],['listen','Listen & watch'],['resources','Resource shelf']].map(([id,t])=>`<button class="tab ${libraryTab===id?'active':''}" data-action="library-tab" data-tab="${id}" role="tab" aria-selected="${libraryTab===id}">${t}</button>`).join('')}</div>${body}`;}
function errorCards(){return state.errors.map(e=>`<article class="error-item"><div class="flex between"><span class="badge ${e.next<=today()?'sand':'green'}">${e.next<=today()?'Review due':'Review '+shortDate(e.next)}</span><button class="icon-btn" data-action="edit-error" data-id="${esc(e.id)}" aria-label="Edit correction">${icon('pen')}</button></div><div class="original mt" lang="fr">${esc(e.original)}</div><div class="corrected" lang="fr">${esc(e.corrected)}</div><p>${esc(e.rule)}</p>${e.example?`<p class="fr" lang="fr">${esc(e.example)}</p>`:''}<div class="actions"><span class="small muted">${esc(e.category||'Sentence repair')} · ${e.reviews} reviews</span><button class="text-btn" data-action="review-error" data-id="${esc(e.id)}">${icon('check')}Reused without notes</button></div></article>`).join('')||`<div class="empty">Add a correction from today’s lesson to begin your error log.</div>`;}
function notebookView(){const draft=state.drafts[state.day]||'',wc=draft.trim()?draft.trim().split(/\s+/).length:0;return heading('Keep the useful corrections.','Your drafts, teacher feedback and personal error log.')+`<div class="flex between wrap"><div class="tabs" role="tablist" aria-label="Notebook sections"><button class="tab ${notebookTab==='draft'?'active':''}" data-action="notebook-tab" data-tab="draft" role="tab" aria-selected="${notebookTab==='draft'}">Daily writing</button><button class="tab ${notebookTab==='errors'?'active':''}" data-action="notebook-tab" data-tab="errors" role="tab" aria-selected="${notebookTab==='errors'}">Correction log</button></div>${button(icon('download')+'Export tutor brief','tutor-export','','secondary sm')}</div>${notebookTab==='draft'?`<div class="grid2"><section class="card"><div class="card-title"><h2>Day ${state.day} · Your draft</h2><span class="badge lavender">${budget().writing} min planned</span></div><p class="muted small">${esc(day().writing)}</p><label class="sr-only" for="draft">Your French draft</label><textarea class="draft" id="draft" data-store="drafts" lang="fr" placeholder="Écrivez votre texte ici…">${esc(draft)}</textarea><div class="word-count" id="word-count">${wc} words · autosaved</div><div class="flex between wrap mt">${completion('writing')}<button class="text-btn" data-action="speak-draft">${icon('volume')}Read aloud</button></div>${note('Your writing is not automatically corrected. Compare it with feedback from your teacher, then write a fresh version below.')}<h3 class="mt">Rewrite after feedback</h3>${textarea('rewrite','Rewrite the important sentences from memory…','',5)}</section><div class="stack"><section class="card"><span class="eyebrow muted">A CLEAR MESSAGE</span><h2 class="mt">Situation → reason → request</h2><div class="example-box" lang="fr" style="font-size:21px">Je vous écris au sujet de mon cours. Mon emploi du temps a changé, donc je ne peux plus venir à 18 h. Serait-il possible de choisir un autre horaire ?</div><p class="muted small">A model based on your original scheduling task. Use it as a structure, not a text to memorise.</p><div class="target-list mt"><label class="checkbox-row"><input type="checkbox" data-check-note="writingChecklist1" ${notesValue('writingChecklist1')==='yes'?'checked':''}>Every sentence has a conjugated verb.</label><label class="checkbox-row"><input type="checkbox" data-check-note="writingChecklist2" ${notesValue('writingChecklist2')==='yes'?'checked':''}>I checked articles and prepositions.</label><label class="checkbox-row"><input type="checkbox" data-check-note="writingChecklist3" ${notesValue('writingChecklist3')==='yes'?'checked':''}>My connector matches the relationship.</label></div></section><section class="card"><h3>Teacher feedback</h3>${textarea('teacherFeedback','Save the two or three most useful corrections…','lesson-note',4)}<div class="mt">${button(icon('plus')+'Add a correction','add-error','','soft')}</div></section></div></div>`:`<section class="card"><div class="section-head"><div><h2>Your personal sentence repairs</h2><p class="muted small mb0">Three starter corrections come from your assessment. Add your own as you learn.</p></div>${button(icon('plus')+'Add correction','add-error','','secondary')}</div><div class="grid2">${errorCards()}</div><p class="muted small mt mb0">Say a fresh example without notes before marking it reviewed. First review after one day, then three, then seven days.</p></section>`}`;}
function progressView(){const completed=CURRICULUM.days.filter(d=>dayDone(d.id)).length,practiceDays=Object.keys(state.activity).length;const minutes=CURRICULUM.days.reduce((n,d)=>n+doneMinutes(d.id),0);const last=state.skills.at(-1);const ratings=['Listening','Reading','Interaction','Speaking','Writing'];return heading('Evidence, not just a streak.','Track what you can use independently—and what still needs support.',false)+`<div class="grid3"><div class="stat"><div class="stat-top">${icon('check')}DAYS COMPLETED</div><div class="stat-value">${completed}<span>/ 112 planned days</span></div><div class="stat-foot">Based on your activity checkboxes</div></div><div class="stat"><div class="stat-top">${icon('leaf')}DAYS WITH PRACTICE</div><div class="stat-value">${practiceDays}<span>calendar days</span></div><div class="stat-foot">Writing, retrieval or task completion</div></div><div class="stat"><div class="stat-top">${icon('cards')}INDEPENDENT VOCABULARY</div><div class="stat-value">${independent()}<span>expressions</span></div><div class="stat-foot">Your examples and self-reported use</div></div></div>
 <section class="card mt"><div class="section-head"><h2>Your 112-day path</h2><span class="small muted">${minutes} planned minutes checked off · not a time log</span></div><div class="heatmap">${CURRICULUM.days.map(d=>`<button class="${dayDone(d.id)?'all':taskCount(d.id)?'some':''} ${d.id===state.day?'selected':''}" data-action="open-day" data-day="${d.id}" aria-label="Day ${d.id}: ${taskCount(d.id)} of ${totalTasks(d.id)} activities complete" title="Day ${d.id} · ${esc(d.title)}"></button>`).join('')}</div><div class="flex wrap mt small muted"><span>Click any day to revisit it.</span><span class="badge">Not started</span><span class="badge green">In progress / complete</span></div></section>
 <div class="grid2 mt"><section class="card"><div class="card-title"><h2>Five skills, separately.</h2>${button(icon('plus')+'Assessment','assessment','','secondary sm')}</div>${last?`<p class="muted small">Latest observation: ${shortDate(last.date)} · ${last.assessor} · Day ${last.day}</p>${ratings.map(k=>{const v=last.ratings[k];return`<div class="skill-row"><span>${k}</span><div class="mini-progress"><span style="width:${v===undefined?0:(v+1)/4*100}%"></span></div><small>${v===undefined?'Not rated':['Full support','Frequent help','Some help','Independent'][v]}</small></div>`}).join('')}<p class="small muted mt">${esc(last.evidence)}</p>`:`<div class="empty"><div class="mini-icon">${icon('flag')}</div><h3>No skill assessment yet.</h3><p>Use your first lesson for an unprepared speaking sample and a fresh listening task. Save the evidence with your teacher.</p>${button('Add baseline assessment','assessment','','soft')}</div>`}<p class="small muted mt mb0">These support ratings are a private tracking scale, not CEFR scores. They do not establish A2, B1 or B2.</p></section><section class="card"><h2>Let the evidence change the plan.</h2><p class="muted small">At Weeks 4, 8, 12 and 16, assess fresh listening, reading, interaction, speaking and writing tasks. Keep the drafts and observations.</p><div class="target-list mt"><div><h3>After Week 4</h3><p class="muted small">Can you make a clear request and tell a connected past story?</p></div><div><h3>After Week 8</h3><p class="muted small">Can you handle familiar situations without a script and explain an opinion with reasons?</p></div><div><h3>Before more difficult B2 work</h3><p class="muted small">Check that B1 skills are stable. Revisit a week when needed; the calendar does not certify a level.</p></div></div>${resourceCard(CURRICULUM.resources.find(r=>r.id==='R6'))}</section></div>
 <section class="card mt"><div class="section-head"><h2>The 16-week roadmap</h2><span class="small muted">All weeks are open. Choose your pace.</span></div><div class="week-grid">${CURRICULUM.weeks.map(w=>{const ds=CURRICULUM.days.filter(d=>d.week===w.week),c=ds.filter(d=>dayDone(d.id)).length;return`<button class="week-card ${w.week===day().week?'current':''}" data-action="open-day" data-day="${ds[0].id}"><span class="eyebrow">WEEK ${String(w.week).padStart(2,'0')} · ${c}/7 DAYS</span><strong>${esc(w.theme)}</strong><div class="mini-progress"><span style="width:${c/7*100}%"></span></div></button>`}).join('')}</div></section>${state.skills.length>1?`<section class="card mt"><h2>Earlier observations</h2>${state.skills.slice(0,-1).reverse().slice(0,8).map(s=>`<div class="error-item"><strong class="small">${shortDate(s.date)} · ${s.assessor} · Day ${s.day}</strong><p>${esc(s.evidence)}</p></div>`).join('')}</section>`:''}`;}
function settingsView(){return heading('A plan that fits your life.','Adjust your routine, keep a backup, and understand what stays local.',false)+`<div class="settings-grid"><div class="stack"><section class="card"><h2>Your routine</h2><div class="field mt"><label for="name">Your first name (optional)</label><input id="name" type="text" data-setting="name" maxlength="60" value="${esc(state.settings.name)}" placeholder="Your first name"></div><div class="field"><label for="start-date">Study Day 1</label><input id="start-date" type="date" data-setting="start" value="${state.settings.start}"><small class="muted">This dates the roadmap; it does not force you to advance. Every seventh study day is lighter.</small></div><div class="field"><label for="mode">Daily study budget</label><select id="mode" data-setting="mode"><option value="full" ${state.settings.mode==='full'?'selected':''}>Full · 180 min, including 60 min with a teacher</option><option value="compact" ${state.settings.mode==='compact'?'selected':''}>Compact · 120 min, including 60 min with a teacher</option></select><small class="muted">Light days stay at 90 minutes. These are different workloads, not promises of equal progress.</small></div><div class="field"><label for="new-limit">Maximum new targets in a review session</label><select id="new-limit" data-setting="newLimit">${[4,6,8].map(n=>`<option value="${n}" ${state.settings.newLimit===n?'selected':''}>${n} new targets</option>`).join('')}</select><small class="muted">The review queue includes older due cards first. Lower this limit when recall or workload is difficult.</small></div>${button('Save preferences','save-settings','','soft')}</section><section class="card"><h2>Open it like an app.</h2><p>The included installable-web-app files are ready for a secure web host. Once hosted, open the same site on a phone or laptop. Installation options depend on the browser.</p>${button(icon('download')+'Install / home-screen help','install','','secondary')}<p class="mt mb0">This file is not a public hosted site. Home-screen installation needs HTTPS hosting (or localhost for development). Progress does not automatically sync between devices.</p></section></div><div class="stack"><section class="card"><h2>Your data, your copy.</h2><p>Drafts, reviews, corrections and assessments are saved in this browser. Clearing site data or using another browser can remove or separate your progress.</p><div class="flex wrap">${button(icon('download')+'Export backup','export-backup','','')}${button(icon('upload')+'Import backup','import-backup','','secondary')}</div><p class="mt">Last backup: <strong>${state.lastBackup?shortDate(state.lastBackup):'not exported yet'}</strong></p>${recoveryRaw!==null?`<div class="mt">${button('Export unreadable recovery file','export-recovery','','secondary')}</div>`:''}${note('Importing replaces the current workspace after confirmation. Export the current version first. Backups contain your personal notes; store and share them carefully.')}<p class="mt mb0">For reliable saving, use the hosted app or the supplied local server. Browser behaviour for a directly opened HTML file can vary.</p></section><section class="card"><h2>What this version does—and doesn’t.</h2><p><strong>Included:</strong> the 112-day plan, 480 scheduled phrase entries, connector and frame cards, spaced review, 96 reference drills, seven original starter packs, guided role-plays, writing, correction logs and manual skill observations.</p><p><strong>Not connected:</strong> AI conversations, automatic writing or pronunciation assessment, teacher accounts, cloud sync and push reminders.</p><p><strong>Later resources:</strong> after the starter week, assignments are mapped from your workbook; exact readings and clips are chosen with your teacher.</p><p><strong>Privacy:</strong> there is no application backend or analytics. External learning links open other sites. Browser speech may use a device or vendor-provided voice service.</p><hr class="section-divider"><div class="flex between wrap"><span class="small muted">Parcours · version 1.0</span>${button('Reset local workspace','reset','','danger sm')}</div></section></div></div>`;}
function modal(title,body,actions=''){const d=$('#modal');if(d.open)d.close();d.innerHTML=`<div class="flex between"><h2 id="modal-title" class="mb0">${esc(title)}</h2><button class="icon-btn" data-action="close-modal" aria-label="Close dialog">${icon('close')}</button></div><div class="mt">${body}</div>${actions?`<div class="dialog-actions">${actions}</div>`:''}`;d.showModal();}
function closeModal(){if($('#modal').open)$('#modal').close();}
function findDrill(id){return CURRICULUM.drills.flatMap(g=>g.items).find(g=>g.id===id)}
function rate(grade){if(!session||!session.revealed)return;const id=session.queue[session.index];if(!getCard(id))return;const prior=state.cards[id]||{stage:0,reviews:0,example:'',independent:false};let stage=prior.stage||0,ms;if(grade==='again'){stage=0;ms=5*60*1000;}else if(grade==='hard'){ms=86400000;}else{ms=[1,3,7,14,30,60][Math.min(stage,5)]*86400000;stage=Math.min(stage+1,6);}state.cards[id]={...prior,stage,last:Date.now(),next:Date.now()+ms,reviews:prior.reviews+1};state.reviewLog.push({date:today(),grade,id});if(state.reviewLog.length>5000)state.reviewLog.shift();activity();session.index++;session.revealed=false;save();render();}
function speak(text){if(!text?.trim()){toast('Add a French sentence first.');return;}if(!('speechSynthesis'in window)){toast('Speech is unavailable here. Use the text with your teacher.');return;}const voices=speechSynthesis.getVoices(),fr=voices.filter(v=>/^fr([_-]|$)/i.test(v.lang));if(!fr.length){toast('No French voice is available in this browser. Use the transcript, or enable a French voice on your device.');return;}speechSynthesis.cancel();speechUtterance=new SpeechSynthesisUtterance(text.slice(0,6000));speechUtterance.lang='fr-FR';speechUtterance.voice=fr.find(v=>v.localService)||fr[0];speechUtterance.rate=.86;speechUtterance.onerror=e=>{if(!['canceled','interrupted'].includes(e.error))toast('Audio could not play here. The written text is still available.');};speechSynthesis.speak(speechUtterance);}
function stopAudio(){if('speechSynthesis'in window)speechSynthesis.cancel();}
function timerSeconds(){return state.timer.deadline?Math.max(0,Math.ceil((state.timer.deadline-Date.now())/1000)):state.timer.remaining;}
function updateTimer(){const sec=timerSeconds();if(state.timer.deadline&&sec===0){state.timer.remaining=0;state.timer.deadline=0;save();toast('Lesson timer finished. Save your teacher’s feedback.');}const t=$('#timer');if(!t)return;t.textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;const b=$('#timer-toggle');b.innerHTML=icon(state.timer.deadline?'pause':'play');b.setAttribute('aria-label',state.timer.deadline?'Pause lesson timer':'Start lesson timer');const elapsed=3600-sec;const phase=sec===0?'Lesson complete':elapsed<300?'Recall & warm-up':elapsed<900?'Targeted correction':elapsed<2400?'Situation practice':elapsed<3000?'Discuss the input':elapsed<3300?'Pronunciation':'Feedback & next step';$('#timer-phase').textContent=phase;}
function downloadFile(content,name,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function exportBackup(){state.lastBackup=today();save();downloadFile(JSON.stringify({app:'parcours',version:1,exportedAt:new Date().toISOString(),data:state},null,2),`Parcours-backup-${today()}.json`,'application/json');toast('Backup exported. Keep it somewhere safe.');if(view==='settings')render();}
function tutorBrief(){const d=day(),f=frame();return`PARCOURS — TUTOR BRIEF\nDay ${d.id} · Week ${d.week} · ${d.title}\nExported ${today()}\n\nGOAL\n${CURRICULUM.meta.note}\n\nTODAY’S LANGUAGE\n${targets().map(c=>`${c.fr} — ${c.en}`).join('\n')||'Review older phrases; no new targets.'}\n\nGRAMMAR\n${d.grammar}\n\nSENTENCE FRAME\n${f.frame}\n\nSITUATION\n${d.teacher}\n\nREADING\n${d.reading}\n${state.materials[state.day]?.readUrl||''}\n\nLISTENING\n${d.listening}\n${state.materials[state.day]?.listenUrl||''}\n\n60-MINUTE AGENDA\n${agenda.map(a=>a.join(' — ')).join('\n')}\n\nWRITING DRAFT\n${state.drafts[state.day]||'(No draft yet)'}\n\nREWRITTEN VERSION\n${notesValue('rewrite')||'(Not yet)'}\n\nSENTENCE PRACTICE\n${notesValue('sentencePractice')}\n\nTEACHER FEEDBACK\n${notesValue('teacherFeedback')}\n\nTOMORROW’S TARGET\n${notesValue('nextTarget')}\n\nCORRECTIONS TO REVISIT\n${state.errors.slice(-10).map(e=>`${e.original}\n→ ${e.corrected}\n${e.rule}\nNew example: ${e.example}`).join('\n\n')}${mediaTutorNotes()}\n\nPRIVACY\nThis export may contain personal notes. It is not an official CEFR assessment.\n`;}
function addCardModal(){modal('A phrase from your life.',`<p class="muted small">Add something you wanted to say but could not express. Confirm the French with your teacher.</p><form id="card-form"><div class="field"><label for="card-fr">French expression</label><input id="card-fr" name="fr" type="text" lang="fr" maxlength="300" placeholder="demander un changement d’horaire" required></div><div class="field"><label for="card-en">Meaning or situation</label><input id="card-en" name="en" type="text" maxlength="500" placeholder="to request a change of time" required></div><button class="button" type="submit">Add to Day ${state.day}</button></form>`);}

function mediaItem(id){return MEDIA_LIBRARY.find(r=>r.id===id);}
function safeMediaURL(value){try{const u=new URL(String(value));return ['http:','https:'].includes(u.protocol)?u.href:'';}catch{return '';}}
function cleanMedia(input){
 const out={saved:[],logs:[],assignments:{}};
 if(!input||typeof input!=='object'||Array.isArray(input))return out;
 const ids=new Set(MEDIA_LIBRARY.map(r=>r.id));
 const text=(v,n)=>typeof v==='string'?v.slice(0,n):'';
 if(Array.isArray(input.saved))out.saved=[...new Set(input.saved.filter(id=>ids.has(id)))];
 if(input.assignments&&typeof input.assignments==='object')for(let d=1;d<=112;d++){if(ids.has(input.assignments[d]))out.assignments[d]=input.assignments[d];}
 if(Array.isArray(input.logs)){const seen=new Set();out.logs=input.logs.slice(-1000).filter(v=>v&&typeof v==='object'&&!Array.isArray(v)).map(v=>{
  let id=typeof v.id==='string'&&/^[a-zA-Z0-9_-]{1,80}$/.test(v.id)?v.id:uid();if(seen.has(id))id=uid();seen.add(id);
  return {id,resource:ids.has(v.resource)?v.resource:'other',title:text(v.title,300),url:safeMediaURL(text(v.url,2000)),date:validDate(v.date)?v.date:today(),day:clamp(v.day,1,112),minutes:clamp(v.minutes,1,300),support:['none','french','english','transcript','mixed'].includes(v.support)?v.support:'none',extent:v.extent==='episode'?'episode':'excerpt',understanding:['lost','gist','details','comfortable'].includes(v.understanding)?v.understanding:'gist',summary:text(v.summary,5000),question:text(v.question,2000),phrase:text(v.phrase,300),meaning:text(v.meaning,500)};
 }).filter(v=>v.title);}
 return out;
}

.join('')}</select></div><div class="field"><label for="media-level">Learning guide</label><select id="media-level">${[['all','All stages'],['A2','A2 · supported'],['B1','B1 · developing'],['B2','B2 · stretch']].map(([v,t])=>`<option value="${v}" ${v===mediaLevel?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="media-access">Access</label><select id="media-access">${[['all','All access'],['free','Free core media'],['paid','Subscription']].map(([v,t])=>`<option value="${v}" ${v===mediaAccess?'selected':''}>${t}</option>`).join('')}</select></div></div><p id="media-result-count" class="small muted" role="status" aria-live="polite"></p></section><div id="media-results" class="media-grid"></div>`}<div class="media-source-note"><strong>About this shelf</strong><p>Levels, excerpt lengths and tasks are Parcours learning guidance, not official CEFR ratings for the programmes. Free means core audio/video; notes or transcripts can be paid extras. Publisher information checked ${MEDIA_CHECKED}. Playback, subtitle availability, catalogues and regional access can change.</p><p>Open official resources in a separate tab. Parcours does not host, download, unlock or automatically track these programmes. Your saved titles and session notes stay local and are included in your backup.</p></div>`;}
function renderMediaResults(){if(view!=='media'||mediaTab==='logs')return;const area=$('#media-results');if(!area)return;const q=noAccents(mediaQuery);const list=MEDIA_LIBRARY.filter(r=>(mediaTab!=='saved'||state.media.saved.includes(r.id))&&(mediaKind==='all'||r.kind===mediaKind)&&(mediaLevel==='all'||r.levels.includes(mediaLevel))&&(mediaAccess==='all'||(mediaAccess==='free'?r.free:!r.free))&&(!q||noAccents([r.title,r.subtitle,r.provider,...r.tags].join(' ')).includes(q)));

function handleMediaClick(action,id,el){switch(action){
 case 'media-tab':mediaTab=el.dataset.tab;render();break;
 case 'media-detail':mediaDetail(id);break;
 case 'media-save':{const n=state.media.saved.indexOf(id);if(!mediaItem(id))return;if(n>=0)state.media.saved.splice(n,1);else state.media.saved.push(id);save();render();toast(n>=0?'Removed from your list.':'Saved to your list.');break;}
 case 'media-clear':mediaTab='browse';mediaKind=mediaLevel=mediaAccess='all';mediaQuery='';render();break;
 case 'media-assign':mediaAssign(id);break;
 case 'media-confirm-assign':mediaAssign(id,true);break;
 case 'media-log':mediaLogModal(id||state.media.assignments[state.day]||'');break;
 case 'media-edit-log':mediaLogModal('',id);break;
 case 'media-delete-log':{const l=state.media.logs.find(x=>x.id===id);if(!l)return;modal('Delete this listening log?',`<p>Remove <strong>${esc(l.title)}</strong> from your session history? Saved vocabulary and daily activity completion will not be changed.</p>`,button('Keep session','close-modal','','secondary')+button('Delete session','media-confirm-delete',`data-id="${esc(id)}"`,'danger'));break;}
 case 'media-confirm-delete':state.media.logs=state.media.logs.filter(l=>l.id!==id);save();closeModal();render();toast('Session removed.');break;
 }}
function saveMediaLog(form){const f=new FormData(form),s=k=>String(f.get(k)||'').trim(),edit=form.dataset.edit;
 if(s('url')&&!safeMediaURL(s('url'))){toast('Use a valid http or https resource link.');return;}
 if(!validDate(s('date'))){toast('Choose a valid practice date.');return;}
 if(!s('title')){toast('Add an episode or scene title.');return;}
 if(!edit&&state.media.logs.length>=1000){toast('Your log is full (1,000 sessions). Export a backup and remove older logs before adding more.');return;}
 const addPhrase=f.get('addPhrase')==='on',fr=s('phrase'),en=s('meaning');
 if(addPhrase&&(!fr||!en)){toast('Add both the French expression and its meaning before adding it to your vocabulary bank.');return;}
 const existing=fr?allCards().find(c=>normal(c.fr)===normal(fr)):null;
 if(addPhrase&&!existing&&state.custom.length>=1000){toast('Your personal phrase bank is full. Uncheck the vocabulary option to save just this session.');return;}
 const item=cleanMedia({logs:[{id:edit||uid(),resource:s('resource'),title:s('title'),url:s('url'),date:s('date'),day:Number(s('day')),minutes:Number(s('minutes')),extent:s('extent'),support:s('support'),understanding:s('understanding'),summary:s('summary'),question:s('question'),phrase:fr,meaning:en}]}).logs[0];
 if(!item)return;const at=state.media.logs.findIndex(l=>l.id===edit);if(edit&&at<0){toast('This session no longer exists. Reopen the listening log.');return;}
 if(at>=0)state.media.logs[at]=item;else state.media.logs.push(item);
 if(addPhrase&&!existing){state.custom.push({id:'custom-'+uid(),fr:item.phrase,en:item.meaning,type:'personal',days:[item.day]});session=null;}
 if(f.get('complete')==='on')(state.done[item.day]??={}).listening=true;
 state.activity[item.date]=true;save();closeModal();mediaTab='logs';if(view==='media')render();else goto('media');toast(addPhrase?(existing?'Session saved. Expression already exists in your bank.':'Session saved. Expression added to your vocabulary bank.'):'Listening session saved.');
}


document.addEventListener('click',async event=>{const el=event.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,id=el.dataset.id;if(a.startsWith('media-')){handleMediaClick(a,id,el);return;}switch(a){
 case'go':closeModal();goto(el.dataset.route);break;
 case'settings':goto('settings');break;
 case'prev-day':setDay(state.day-1);break;
 case'next-day':setDay(state.day+1);break;
 case'select-day':setDay(el.dataset.day);break;
 case'open-day':setDay(el.dataset.day);goto('today');break;
 case'open-task':if(el.dataset.key==='reading')libraryTab='read';if(el.dataset.key==='listening')libraryTab='listen';if(el.dataset.key==='writing')notebookTab='draft';goto(el.dataset.route);break;
 case'complete':{const k=el.dataset.key;(state.done[state.day]??={})[k]=!state.done[state.day]?.[k];if(state.done[state.day][k])activity();save();render();toast(state.done[state.day][k]?'Practice marked complete.':'Completion undone.');break;}
 case'vocab-tab':vocabTab=el.dataset.tab;if(vocabTab==='review')session=null;render();break;
 case'library-tab':libraryTab=el.dataset.tab;render();break;
 case'notebook-tab':notebookTab=el.dataset.tab;render();break;
 case'reveal':if(session){session.revealed=true;render();}break;
 case'rate':rate(el.dataset.grade);break;
 case'add-card':addCardModal();break;
 case'card-detail':cardDetail(id);break;
 case'practice-card':closeModal();session={queue:[id],index:0,revealed:false,total:1};vocabTab='review';if(view!=='vocabulary'){view='vocabulary';history.replaceState(null,'','#vocabulary');}render();break;
 case'speak-card':speak(getCard(id)?.fr);break;
 case'speak-frame':speak(frame()?.frame);break;
 case'speak-notes':speak(notesValue(el.dataset.key));break;
 case'speak-draft':speak(state.drafts[state.day]);break;
 case'speak-reading':speak(pack()?.text);break;
 case'play-dialogue':speak(pack()?.audio);break;
 case'stop-audio':stopAudio();break;
 case'round':round=clamp(el.dataset.round,0,2);turn=0;render();break;
 case'next-prompt':turn=(turn+1)%4;render();break;
 case'speak-prompt':{const p=pack()?.turns||['Expliquez la situation à votre interlocuteur.','Pourquoi est-ce important pour vous ? Donnez un exemple.','Posez une question et proposez une solution.','Votre première solution n’est pas possible. Trouvez une autre possibilité.'];speak(round===2?p[3]:p[turn%4]);break;}
 case'check-drill':case'reveal-drill':{const g=findDrill(id);if(!g)break;const text=$('#'+id)?.value||'';if(a==='check-drill'&&!text.trim()){toast('Try a French answer first, or choose Model.');break;}const match=g.accept.some(ans=>normal(ans)===normal(text)),near=g.accept.some(ans=>noAccents(ans)===noAccents(text));state.drills[id]={text,checked:true,result:a==='reveal-drill'?'compare':match?'match':near?'near':'compare'};activity();save();render();break;}
 case'add-error':errorModal();break;
 case'edit-error':errorModal(id);break;
 case'delete-error':state.errors=state.errors.filter(e=>e.id!==id);save();closeModal();render();toast('Correction removed.');break;
 case'review-error':{const e=state.errors.find(e=>e.id===id);if(e){e.reviews++;e.next=dateAdd(today(),e.reviews===1?1:e.reviews===2?3:7);activity();save();render();toast('Correction review saved.');}break;}
 case'assessment':assessmentModal();break;
 case'timer-toggle':if(state.timer.deadline){state.timer.remaining=timerSeconds();state.timer.deadline=0;}else{if(!state.timer.remaining)state.timer.remaining=3600;state.timer.deadline=Date.now()+state.timer.remaining*1000;}save();updateTimer();break;
 case'timer-reset':state.timer={remaining:3600,deadline:0,day:state.day};save();render();break;
 case'tutor-export':downloadFile(tutorBrief(),`Parcours-tutor-day-${String(state.day).padStart(3,'0')}.txt`,'text/plain;charset=utf-8');toast('Tutor brief exported.');break;
 case'export-backup':exportBackup();break;
 case'export-recovery':if(recoveryRaw!==null)downloadFile(recoveryRaw,'Parcours-unreadable-workspace.txt','text/plain;charset=utf-8');break;
 case'import-backup':$('#backup-file').value='';$('#backup-file').click();break;
 case'confirm-import':if(pendingBackup){stopAudio();recoveryRaw=null;state=pendingBackup;pendingBackup=null;session=null;save();closeModal();render();toast('Backup restored on this device.');}break;
 case'close-modal':pendingBackup=null;closeModal();break;
 case'refresh-material':render();toast('Resource details saved.');break;
 case'save-settings':save();session=null;render();toast('Preferences saved.');break;
 case'reset':modal('Reset this local workspace?',`<p>This deletes your progress, drafts and notes from this browser. The curriculum stays available. Export a backup before resetting.</p><form id="reset-form"><div class="field"><label for="reset-word">Type RESET to confirm</label><input id="reset-word" name="confirm" type="text" autocomplete="off" required></div><button class="button danger" type="submit">Reset local data</button></form>`,button('Export a backup first','export-backup','','secondary'));break;
 case'more':modal('Your learning space',`<nav class="nav-list">${NAV.map(([route,ic,t])=>`<button class="nav-link" style="border:0;background:none;width:100%;text-align:left" data-action="go" data-route="${route}">${icon(ic)}${t}</button>`).join('')}<button class="nav-link" style="border:0;background:none" data-action="go" data-route="settings">${icon('settings')}Settings & backup</button></nav>`);break;
 case'install':if(installPrompt){await installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;}else modal('Use Parcours on your home screen.',`<p>First, publish the included app folder to an HTTPS website. This downloadable file is not a live hosted site.</p><p><strong>On iPhone:</strong> open the hosted app in Safari and look for <em>Share → Add to Home Screen</em>.</p><p><strong>On Android:</strong> open the hosted app in Chrome and look for <em>Install app</em> or <em>Add to Home screen</em> in the menu.</p><p><strong>On a computer:</strong> a supporting browser may offer an install icon in the address bar.</p><p class="muted small">Exact options vary by browser. Core content can work offline after the hosted app has been opened and cached. External videos, websites and some speech voices still need a connection. Use export/import to transfer progress between devices.</p>`);break;
 }});
document.addEventListener('input',event=>{const el=event.target;if(el.id==='media-search'){mediaQuery=el.value;renderMediaResults();return;}if(el.id==='bank-search'){bankQuery=el.value;renderBank();return;}if(el.dataset.drill){state.drills[el.dataset.drill]={text:el.value,checked:false,result:''};save();return;}if(el.dataset.store){const store=el.dataset.store;if(store==='drafts'){state.drafts[state.day]=el.value.slice(0,20000);const wc=$('#word-count');if(wc)wc.textContent=`${el.value.trim()?el.value.trim().split(/\s+/).length:0} words · autosaved`;}else if(['notes','materials'].includes(store)){(state[store][state.day]??={})[el.dataset.key]=el.value.slice(0,20000);}if(store==='materials'&&['listenTitle','listenUrl'].includes(el.dataset.key))delete state.media.assignments[state.day];if(el.value.trim()&&store!=='materials')activity();save();}if(el.dataset.setting==='name'){state.settings.name=el.value.slice(0,60);save();}});
document.addEventListener('change',event=>{const el=event.target;if(['media-kind','media-level','media-access'].includes(el.id)){if(el.id==='media-kind')mediaKind=el.value;if(el.id==='media-level')mediaLevel=el.value;if(el.id==='media-access')mediaAccess=el.value;renderMediaResults();return;}if(el.id==='bank-filter'){bankFilter=el.value;renderBank();return;}if(el.dataset.checkNote){(state.notes[state.day]??={})[el.dataset.checkNote]=el.checked?'yes':'no';save();}const s=el.dataset.setting;if(!s)return;if(s==='day'){setDay(el.value);return;}if(s==='start'){if(!validDate(el.value)){toast('Choose a valid start date.');return;}state.settings.start=el.value;}if(s==='mode')state.settings.mode=el.value==='compact'?'compact':'full';if(s==='newLimit')state.settings.newLimit=clamp(el.value,4,8);save();session=null;});
document.addEventListener('submit',event=>{const form=event.target;if(form.id==='media-log-form'){event.preventDefault();saveMediaLog(form);return;}if(!['card-form','example-form','error-form','assessment-form','reset-form'].includes(form.id))return;event.preventDefault();const f=new FormData(form),s=k=>String(f.get(k)||'').trim();switch(form.id){
 case'card-form':{if(state.custom.length>=1000){toast('The personal phrase limit is 1,000. Export a backup before adding more.');return;}const fr=s('fr'),en=s('en');if(!fr||!en)return;const existing=allCards().find(c=>normal(c.fr)===normal(fr));if(existing){cardDetail(existing.id);toast('This expression is already in your bank. Add an example instead.');return;}state.custom.push({id:'custom-'+uid(),fr:fr.slice(0,300),en:en.slice(0,500),type:'personal',days:[state.day]});session=null;activity();save();closeModal();render();toast('Personal phrase added to this study day.');break;}
 case'example-form':{const id=form.dataset.id,example=s('example'),ind=f.get('independent')==='on';if(ind&&!example){toast('Add an example to support independent use.');return;}state.cards[id]={stage:0,reviews:0,next:Date.now(),last:0,...state.cards[id],example:example.slice(0,2000),independent:ind};activity();save();closeModal();render();toast('Example saved.');break;}
 case'error-form':{const id=form.dataset.id,prior=state.errors.find(e=>e.id===id);const item={id:id||uid(),original:s('original').slice(0,2000),corrected:s('corrected').slice(0,2000),rule:s('rule').slice(0,2000),example:s('example').slice(0,2000),category:s('category'),created:prior?.created||today(),next:prior?.next||dateAdd(today(),1),reviews:prior?.reviews||0};if(!item.original||!item.corrected)return;if(prior)state.errors[state.errors.indexOf(prior)]=item;else state.errors.push(item);activity();save();closeModal();render();toast('Correction saved for a later review.');break;}
 case'assessment-form':{const ratings={};for(const k of ['Listening','Reading','Interaction','Speaking','Writing'])if(s(k)!=='')ratings[k]=Number(s(k));if(!Object.keys(ratings).length){toast('Rate at least one skill that was observed.');return;}if(!s('evidence'))return;state.skills.push({id:uid(),date:today(),day:state.day,assessor:s('assessor'),ratings,evidence:s('evidence').slice(0,5000)});save();closeModal();render();toast('Skill observation saved.');break;}
 case'reset-form':if(s('confirm')!=='RESET'){toast('Type RESET exactly to confirm.');return;}stopAudio();recoveryRaw=null;state=defaults();session=null;save();closeModal();goto('today');render();toast('Local workspace reset.');break;
 }});
$('#backup-file').addEventListener('change',async event=>{const file=event.target.files?.[0];if(!file)return;if(file.size>5*1024*1024){toast('This backup is too large. Maximum size: 5 MB.');return;}try{const raw=JSON.parse(await file.text());if(raw.app!=='parcours'||raw.version!==1)throw Error('Choose a Parcours version 1 JSON backup.');pendingBackup=cleanState(raw.data);modal('Restore this backup?',`<p>This will replace this browser’s current progress, notes and preferences with the selected backup.</p><p><strong>${esc(file.name)}</strong><br>Saved study day: ${pendingBackup.day}<br>Corrections: ${pendingBackup.errors.length}<br>Skill observations: ${pendingBackup.skills.length}</p><p class="muted small">Export your current workspace first if you need to keep it.</p>`,button('Cancel','close-modal','','secondary')+button('Replace & restore','confirm-import'));}catch(e){toast('Backup not imported: '+e.message);pendingBackup=null;}});
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;});
window.addEventListener('pagehide',()=>{stopAudio();save();});
// Detect updates from another tab so we do not silently overwrite them.
window.addEventListener('storage',event=>{if(event.key===KEY&&event.newValue){try{state=cleanState(JSON.parse(event.newValue));session=null;render();toast('Workspace updated from another tab.');}catch{toast('Another tab saved unreadable data. Export your current backup.');}}});
// PWA installation is enabled for the hosted/index build, not the standalone download.
if(!globalThis.PARCOURS_STANDALONE&&['http:','https:'].includes(location.protocol)){
 const manifest=document.createElement('link');manifest.rel='manifest';manifest.href='./manifest.webmanifest';document.head.append(manifest);
 const apple=document.createElement('link');apple.rel='apple-touch-icon';apple.href='./assets/icon-192.png';document.head.append(apple);
 const fav=document.createElement('link');fav.rel='icon';fav.type='image/png';fav.href='./assets/icon-192.png';document.head.append(fav);
 if('serviceWorker'in navigator&&window.isSecureContext)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{toast('Offline installation is unavailable here. The app still works online.');}));
}
if('speechSynthesis'in window)speechSynthesis.getVoices();
setInterval(updateTimer,1000);
render();
</script>
