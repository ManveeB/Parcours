<script>const CURRICULUM = {"days":[{"id":1,"week":1,"dayName":"Monday","minutes":180,"phase":"Month 1 - Foundations","title":"Introduce yourself and your work","phraseText":"1. travailler dans… — to work in…\n2. s’occuper de… — to take care of…\n3. apprendre le français — to learn French\n4. prendre des cours — to take lessons\n5. un objectif — an objective\n6. progresser en français — to improve in French","frameText":"7. et — and\n8. Je travaille dans… et je m’occupe de…\nUse known items again; only create new flashcards for genuinely unfamiliar language.","grammar":"Je/j’ + present; ce/cette; make 3 statements and 3 questions. Reference: R1. Finish with 3 personal examples.","reading":"Read R7: C’est ma vie. Answer the questions, then write 3 facts in your own words.","listening":"Clip A: R2, current working level, 1–3-minute excerpt on work, routines, class schedules. Listen for gist without text, then details; check the transcript and replay 30–60 seconds.","teacher":"Start with an unprepared speaking sample and a short listening check to assess those skills separately. Then: Meet a new colleague. Explain your job and French-learning goal; answer 3 follow-up questions. Use the 60-minute lesson structure in the Tutor guide.","writing":"Write 6 connected sentences on ‘Introduce yourself and your work’. Use 3 target phrases and the day’s frame; finish by saying the message aloud.","review":"Review today’s targets again later today. Retrieve before looking. Say the French aloud and use difficult items in a new sentence."},{"id":2,"week":1,"dayName":"Tuesday","minutes":180,"phase":"Month 1 - Foundations","title":"Describe your routine","phraseText":"1. commencer à… — to start at…\n2. finir à… — to finish at…\n3. prendre une pause — to take a break\n4. un emploi du temps — a schedule\n5. être disponible — to be available\n6. être en retard — to be late","frameText":"7. d’abord… ensuite… — first… then…\n8. D’abord, je… Ensuite, je…\nUse known items again; only create new flashcards for genuinely unfamiliar language.","grammar":"Present tense of commencer, finir, prendre; add times to 6 sentences. Reference: R1. Finish with 3 personal examples.","reading":"Read R8: La routine quotidienne. Underline time expressions and 5 present-tense verbs; describe your own day.","listening":"Reuse Clip A. Listen without text, take 5 notes, then repeat 30–60 seconds aloud and give a 1-minute summary. Spend the block improving understanding, not finding a new video.","teacher":"Tell a colleague your day. They propose a meeting when you are busy; find another time. Use the 60-minute lesson structure in the Tutor guide.","writing":"Draft a 90–120-word message/story/opinion connected to today’s situation. Stop after 25 minutes and finish the draft in tomorrow’s block if needed. Send it for correction.","review":"Review target sets from Days 1. Retrieve before looking. Say the French aloud and use difficult items in a new sentence."},{"id":3,"week":1,"dayName":"Wednesday","minutes":180,"phase":"Month 1 - Foundations","title":"Ask to change a lesson","phraseText":"1. demander un changement — to request a change\n2. changer d’horaire — to change time slots\n3. reporter un cours — to postpone a lesson\n4. un créneau — a time slot\n5. prévenir quelqu’un — to let someone know\n6. cela me convient — that suits me","frameText":"7. parce que — because\n8. Je vous écris pour demander…\nUse known items again; only create new flashcards for genuinely unfamiliar language.","grammar":"Pouvoir/vouloir + infinitive; practise est-ce que and question intonation. Reference: R1. Finish with 3 personal examples.","reading":"Read R9: La lettre. Identify the greeting, purpose and ending. Compare its informal tone with your school email.","listening":"Clip B: R2, 1–3-minute excerpt linked to the week’s theme. First listen without text; check 3 details and explain what the speaker wants.","teacher":"Call the language school to change your 18:00 class. The first alternative is unavailable. Use the 60-minute lesson structure in the Tutor guide.","writing":"Finish or revise Tuesday’s draft using feedback. Rewrite the 3 most important corrected sentences from memory and say them aloud.","review":"Review target sets from Days 2. Retrieve before looking. Say the French aloud and use difficult items in a new sentence."},{"id":4,"week":1,"dayName":"Thursday","minutes":180,"phase":"Month 1 - Foundations","title":"Explain new responsibilities","phraseText":"1. avoir de nouvelles responsabilités — to have new responsibilities\n2. être responsable de… — to be responsible for…\n3. répondre à un client — to reply to a client\n4. une réunion — a meeting\n5. un décalage horaire — a time difference\n6. devoir rester au travail — to have to stay at work","frameText":"7. donc — so / therefore\n8. Je ne peux plus… parce que…\nUse known items again; only create new flashcards for genuinely unfamiliar language.","grammar":"Devoir + infinitive; ne… plus; de + les = des; aux États-Unis. Reference: R1. Finish with 3 personal examples.","reading":"Read R10: Jours de la semaine. List 5 activities and explain your own weekly schedule.","listening":"Reuse Clip B. Work on one difficult 30–60 second passage. Check word boundaries, imitate the rhythm, and retell the message without the transcript.","teacher":"Explain new duties to your teacher. They ask why your former timetable no longer works. Use the 60-minute lesson structure in the Tutor guide.","writing":"Write a short response on ‘Explain new responsibilities’ using a position, reason and example. Record a 2-minute version without reading.","review":"Review target sets from Days 3, 1. Retrieve before looking. Say the French aloud and use difficult items in a new sentence."},{"id":5,"week":1,"dayName":"Friday","minutes":180,"phase":"Month 1 - Foundations","title":"Confirm an arrangement","phraseText":"1. confirmer un rendez-vous — to confirm an appointment\n2. annuler une réservation — to cancel a booking\n3. proposer une solution — to propose a solution\n4. une confirmation — a confirmation\n5. remercier quelqu’un — to thank someone\n6. à l’avance — in advance","frameText":"7. mais — but\n8. Est-ce que je peux… ?\nUse known items again; only create new flashcards for genuinely unfamiliar language.","grammar":"Present-tense questions; pour + infinitive; repair 5 sentences from your writing. Reference: R1. Finish with 3 personal examples.","reading":"Read R11: Une conversation téléphonique. Find 3 questions and create 3 similar questions for a school receptionist.","listening":"Clip C: a fresh R2 clip (1–3-minute excerpt) chosen for today’s role-play; later use R3/R4 if accessible. Identify viewpoint, supporting examples and 3 useful phrases.","teacher":"Confirm a new lesson time. The receptionist reads back the wrong day; correct it politely. Use the 60-minute lesson structure in the Tutor guide.","writing":"Write 90–120 words for the week’s practical task. Time-box to 25 minutes; finish during Saturday’s writing block if needed.","review":"Review target sets from Days 4, 2. Retrieve before looking. Say the French aloud and use difficult items in a new sentence."},{"id":6,"week":1,"dayName":"Saturday","minutes":180,"phase":"Month 1 - Foundations","title":"Consolidation and transfer","phraseText":"No new vocabulary targets. Retrieve this week’s phrases and previously difficult items; explain any forgotten word without translating it.","frameText":"Reuse 3–5 connectors naturally. Make 3 new sentences with earlier sentence frames. Do not force a connector into every sentence.","grammar":"20-minute mixed retrieval quiz on this week’s grammar and your recurring errors. Correct, explain and produce a new example.","reading":"Read one UNSEEN text at your current level, selected by the teacher. Answer comprehension questions before looking up words. Time-box to 20 minutes.","listening":"Unseen listening chosen by the teacher, with questions. Follow the agreed number of listens  a bill","phraseText":"1. payer par carte — to pay by card\n2. payer en espèces — to pay in cash\n3. un ticket de caisse — a receipt\n4. rendre la monnaie — to give change\n5. une erreur de prix — a pricing error\n6. vérifier le montant — to check the amount","frameText":"7. car — because\n8. Je pense qu’il y a une erreur sur…\nUse known items again; only create new flashcards for genuinely unfamiliar language.","grammar":"Question words combien/quel; numbers and prices; repeat spoken amounts. Reference: R1. Finish with 3 personal examples.","reading":"Read a second short text on ‘Pay and check a bill’ (120–250 words maximum). Identify the author’s point and compare it with your first source. Use R5 or teacher-selected material.","listening":"Reuse Clip B. Work on one difficult 30–60 second passage. Check word boundaries, imitate the rhythm, and retell the message without the transcript.","teacher":"Query a bill with one wrong item. Ask the seller to check the total. Use the 60-minute lesson structure in the Tutor guide.","writing":"Write a short response on ‘Pay and check a bill’ using a position, reason and example. Record a 2-minute version without reading.","review":"Review target sets from Days 10, 8, 4. Retrieve before looking. Say the French aloud and use difficult items in a new sentence."},{"id":12,"week":2,"dayName":"Friday","minutes":180,"phase":"Month 1 - Foundations","title":"Return an item","phraseText":"1. rapporter un article — to return an item\n2. demander un remboursement — to ask for a refund\n3. échanger un produit — to exchange a product\n4. être abîmé — to be damaged\n5. ne pas fonctionner — not to work\n6. garder le reçu — to keep the receipt","frameText":"7. c’est pourquoi — that is why\n8. Ce produit ne… pas ; est-ce que je peux… ?\nUse known items again; only create new flashcards for genuinely unfamiliar language.","grammar":"Ne… pas/ne… plus; article changes after negation; contrast demander and commander. Reference: R1. Finish with 3 personal examples.","reading":"Read a short model message or opinion text on this week’s theme (120–250 words maximum), supplied by your teacher. Label its purpose, reason, example and ending.","listening":"Clip C: a fresh R2 clip (1–3-minute excerpt) chosen for today’s role-play; later use R3/R4 if accessible. Identify viewpoint, supporting examples and 3 useful phrases.","teacher":"Return a damaged purchase. The seller offers an exchange instead of a refund. Use the 60-minute lesson structure in the Tutor guide.","writing":"Write 90–120 words for the week’s practical task. Time-box to 25 minutes; finish during Saturday’s writing block if needed.","review":"Review target sets from Days 11, 9, 5. Retrieve before looking. Say the French aloud and use difficult items in a new sentence."},{"id":13,"week":2,"dayName":"Saturday","minutes":180,"phase":"Month 1 - Foundations","title":"Consolidation and transfer","phraseText":"No new vocabulary targets. Retrieve this week’s phrases and previously difficult items; explain any forgotten word without translating it.","frameText":"Reuse 3–5 connectors naturally. Make 3 new sentences with earlier sentence frames. Do not force a connector into every sentence.","grammar":"20-minute mixed retrieval quiz on this week’s grammar and your recurring errors. Correct, explain and produce a new example.","reading":"Read one UNSEEN text at your current level, selected by the teacher. Answer comprehension questions before looking up words. Time-box to 20 minutes.","listening":"Unseen listening chosen by the teacher, with questions. Follow the agreed number of listens. Keep this separate from repeatedly practised clips; record the result.","teacher":"Combine two of the week’s situations. Round 1 with brief notes; Round 2 without notes; Round 3 with an unexpected complication. Use 60 minutes including feedback.","writing":"Finish/revise Friday’s text, compare with your first draft and log 3 recurring errors. Record a 3–5 minute weekly summary us ing":"R5 at the current working level, or a teacher-selected article: 120–250 words on leisure, travel experiences, culture. Find the main idea and 3 details.","listening":"Clip A: R2, current working level, 1–3-minute excerpt on leisure, travel experiences, culture. Listen for gist without text, then details; check the transcript and replay 30–60 seconds.","teacher":"Tell your teacher about your weekend without notes. They ask when, where and with whom. Use the 60-minute lesson structure in the Tutor guide.","writing":"Write 6 connected sentences on ‘Describe your weekend’. Use 3 target phrases and the day’s frame; finish by saying the message aloud.","review":"Review target sets from Days 12, 8, 1. Retrieve before looking. Say the French aloud and use difficult items in a new sentence."},{"id":16,"week":3,"dayName":"Tuesday","minutes":180,"phase":"Month 1 - Foundations","title":"Explain a journey","phraseText":"1. prendre le train — to take the train\n2. rater une correspondance — to miss a connection\n3. arriver à destination — to arrive at your destination\n4. partir tôt — to leave early\n5. un trajet — a journey\n6. un billet aller-retour — a return ticket","frameText":"7. ensuite — then\n8. Je suis arrivé(e)… puis j’ai…\nUse known items again; only create new flashcards for genuinely unfamiliar language.","grammar":"Passé composé with être: aller, venir, arriver, partir; agreement as appropriate. Reference: R1. Finish with 3 personal examples.","reading":"Read a teacher-selected practical document on ‘Explain a journey’: an email, timetable, advert, form or short proposal. Find the purpose, constraints and required action. Use fictional personal details.","listening":"Reuse Clip A. Listen without text, take 5 notes, then repeat 30–60 seconds aloud and give a 1-minute summary. Spend the block improving understanding, not finding a new video.","teacher":"Explain to a station employee how you missed a train and ask what to do next. Use the 60-minute lesson structure in the Tutor guide.","writing":"Draft a 90–120-word message/story/opinion connected to today’s situation. Stop after 25 minutes and finish the draft in tomorrow’s block if needed. Send it for correction.","review":"Review target sets from Days 15, 9, 2. Retrieve before looking. Say the French aloud and use difficult items in a new sentence."},{"id":17,"week":3,"dayName":"Wednesday","minutes":180,"phase":"Month 1 - Foundations","title":"Talk about a cultural visit","phraseText":"1. une exposition — an exhibition\n2. une visite guidée — a guided tour\n3. découvrir un lieu — to discover a place\n4. acheter un billet — to buy a ticket\n5. faire la queue — to queue\n6. prendre des photos — to take photos","frameText":"7. après cela — after that\n8. J’ai aimé… parce que…\nUse known items again; only create new flashcards for genuinely unfamiliar language.","grammar":"Common irregular participles: vu, lu, fait, pris; add venir de + infinitive as recognition. Reference: R1. Finish with 3 personal examples.","reading":"Read the transcript of Clip B (R2; R3 later if suitable), AFTER listening. Mark sentence patterns and select no more than 3 useful expressions.","listening":"Clip B: R2, 1–3-minute excerpt linked to the week’s theme. First listen without text; check 3 details and explain what the speaker wants.","teacher":"Describe a museum visit to a friend and answer questions about what you enjoyed. Use the 60-minute lesson structure in the Tutor guide.","writing":"Finish or revise Tuesday’s draft using feedback. Rewrite the 3 most important corrected sentences from memory and say them aloud.","review":"Review target sets from Days 16, 10, 3. Retrieve before looking. Say the French aloud and use difficult items in a new sentence."},{"id":18,"week":3,"dayName":"Thursday","minutes":180,"phase":"Month 1 - Foundations","title":"Tell a social story","phraseText":"1. inviter quelqu’un — to invite someone\n2. se retrouver — to meet up\n3. se promener — to go for a walk\n4. fai e French aloud and use difficult items in a new sentence."},{"id":21,"week":3,"dayName":"Sunday","minutes":90,"phase":"Month 1 - Foundations","title":"Light review and enjoyable conversation","phraseText":"No new vocabulary targets. Retrieve this week’s phrases and previously difficult items; explain any forgotten word without translating it.","frameText":"Reuse 3–5 connectors naturally. Make 3 new sentences with earlier sentence frames. Do not force a connector into every sentence.","grammar":"No formal grammar block. The teacher only notes errors that block understanding.","reading":"Read for pleasure for 10 minutes: revisit an easy text or continue an accessible story. No vocabulary-hunting requirement.","listening":"Enjoy or replay an easy French clip for 10 minutes, with French subtitles if helpful. No new material required.","teacher":"Keep the 60-minute session relaxed: discuss an interest, retell the week and select next week’s material. No new grammar lecture.","writing":"No required writing. Tell your teacher one enjoyable thing about the week and choose next week’s three clips together.","review":"10 minutes of vocabulary review only. Pause new cards if your review load is growing."},{"id":22,"week":4,"dayName":"Monday","minutes":180,"phase":"Month 1 - Foundations","title":"Describe earlier routines","phraseText":"1. autrefois — in the past\n2. avoir l’habitude de… — to be used to doing…\n3. tous les matins — every morning\n4. passer du temps à… — to spend time doing…\n5. se lever tôt — to get up early\n6. à cette époque — at that time","frameText":"7. quand — when\n8. Avant, je… ; maintenant, je…\nUse known items again; only create new flashcards for genuinely unfamiliar language.","grammar":"Imparfait formation: nous stem and endings; être exception; 6 habits. Reference: R1. Finish with 3 personal examples.","reading":"R5 at the current working level, or a teacher-selected article: 120–250 words on homes, life stories, personal change. Find the main idea and 3 details.","listening":"Clip A: R2, current working level, 1–3-minute excerpt on homes, life stories, personal change. Listen for gist without text, then details; check the transcript and replay 30–60 seconds.","teacher":"Compare an old daily routine with your current one. Use the 60-minute lesson structure in the Tutor guide.","writing":"Write 6 connected sentences on ‘Describe earlier routines’. Use 3 target phrases and the day’s frame; finish by saying the message aloud.","review":"Review target sets from Days 19, 15, 8. Retrieve before looking. Say the French aloud and use difficult items in a new sentence."},{"id":23,"week":4,"dayName":"Tuesday","minutes":180,"phase":"Month 1 - Foundations","title":"Describe a previous home","phraseText":"1. un quartier calme — a quiet neighbourhood\n2. habiter près de… — to live near…\n3. un appartement lumineux — a bright flat\n4. partager un logement — to share accommodation\n5. un voisin — a neighbour\n6. déménager — to move home","frameText":"7. à l’époque — at the time\n8. Quand j’habitais…, il y avait…\nUse known items again; only create new flashcards for genuinely unfamiliar language.","grammar":"Imparfait descriptions with être/avoir/il y avait; adjective agreement. Reference: R1. Finish with 3 personal examples.","reading":"Read a teacher-selected practical document on ‘Describe a previous home’: an email, timetable, advert, form or short proposal. Find the purpose, constraints and required action. Use fictional personal details.","listening":"Reuse Clip A. Listen without text, take 5 notes, then repeat 30–60 seconds aloud and give a 1-minute summary. Spend the block improving understanding, not finding a new video.","teacher":"Describe a former home so your teacher can draw a simple plan from your explanation. Use the 60-minute lesson structure in the Tutor guide.","writing":"Draft a 90–120-word message/story/opinion connected to today’s situation. Stop after 25 minutes and finish the draft in tomorrow’s block if needed. Send it for correction.","review":"Review target sets from Days 22, 16, 9. Retrieve before looking. Say the French aloud and use difficult items in a new sentence."},{"id":24,"week":4,"dayName":"Wednesday","minutes":180,"phase":"Month 1 - Foundations","title":"Tell an interrupted story","phraseText":"1. être en train de… — to be in the middle of…\n2. tout à coup — suddenly\n3. recevoir un appel — to receive a call\n4. pleuvoir — to rain\n5. se dépêcher — to hurry\n6. un imprévu — an unexpected event","frameText":"7. pendant que — while\n8. Je… quand… est arrivé.\nUse known items again; only create new flashcards for genuinely unfamiliar language.","grammar":"Background in imparfait versus event in passé composé; build 3 paired sentences. Reference: R1. Finish with 3 personal examples.","reading":"Read the transcript of Clip B (R2; R3 later if suitable), AFTER listening. Mark sentence patterns and select no more than 3 useful expressions.","listening":"Clip B: R2, 1–3-minute excerpt linked to the week’s theme. First listen without text; check 3 details and explain what the speaker wants.","teacher":"Tell a story interrupted by an unexpected phone call; answer follow-ups. Use the 60-minute lesson structure in the Tutor guide.","writing":"Finish or revise Tuesday’s draft using feedback. Rewrite the 3 most important corrected sentences from memory and say them aloud.","review":"Review target sets from Days 23, 17, 10. Retrieve before looking. Say the French aloud and use difficult items in a new sentence."},{"id":25,"week":4,"dayName":"Thursday","minutes":180,"phase":"Month 1 - Foundations","title":"Compare then and now","phraseText":"1. avant — before\n2. maintenant — now\n3. être plus à l’aise — to feel more comfortable\n4. gagner du temps — to save time\n5. changer ses habitudes — to change one’s habits\n6. de moins en moins — less and less","frameText":"7. alors que — whereas / while\n8. À l’époque, je… alors qu’aujourd’hui…\nUse known items again; only sson structure in the Tutor guide.","writing":"Write 6 connected sentences on ‘Plan a trip’. Use 3 target phrases and the day’s frame; finish by saying the message aloud.","review":"Review target sets from Days 26, 22, 15. Retrieve before looking. Say the French aloud and use difficult items in a new sentence."},{"id":30,"week":5,"dayName":"Tuesday","minutes":180,"phase":"Month 2 - B1 development","title":"Book accommodation","phraseText":"1. réserver une chambre — to book a room\n2. une nuitée — an overnight stay\n3. le petit-déjeuner compris — breakfast included\n4. une chambre disponible — an available room\n5. confirmer les dates — to confirm dates\n6. une réservation — a booking","frameText":"7. plus tard — later\n8. Nous resterons… pendant…\nUse known items again; only create new flashcards for genuinely unfamiliar language.","grammar":"Regular futur simple; useful irregular stems: ser-, aur-, ir-, fer-. Reference: R1. Finish with 3 personal examples.","reading":"Read a teacher-selected practical document on ‘Book accommodation’: an email, timetable, advert, form or short proposal. Find the purpose, constraints and required action. Use fictional personal details.","listening":"Reuse Clip A. Listen without text, take 5 notes, then repeat 30–60 seconds aloud and give a 1-minute summary. Spend the block improving understanding, not finding a new video.","teacher":"Book a room and ask about arrival time. The room type you request is unavailable. Use the 60-minute lesson structure in the Tutor guide.","writing":"Draft a 160–190-word message/story/opinion connected to today’s situation. Stop after 25 minutes and finish the draft in tomorrow’s block if needed. Send it for correction.","review":"Review target sets from Days 29, 23, 16. Retrieve before looking. Say the French aloud and use difficult items in a new sentence."},{"id":31,"week":5,"dayName":"Wednesday","minutes":180,"phase":"Month 2 - B1 development","title":"Ask about transport","phraseText":"1. un quai — y saying the message aloud.","review":"Review target sets from Days 61, 57, 50. Retrieve before looking. Say the French aloud and use difficult items in a new sentence."},{"id":65,"week":10,"dayName":"Tuesday","minutes":180,"phase":"Month 3 - B2 development","title":"Discuss transport choices","phraseText":"1. les transports en commun (m.) — public transport\n2. un déplacement — a trip / journey\n3. se déplacer à vélo — to travel by bike\n4. un trajet quotidien — a daily journey\n5. une alternative — an alternative\n6. limiter les déplacements — to limit journeys","frameText":"7. pour que — so that\n8. Il est important que…\nUse known items again; only create new flashcards for genuinely unfamiliar language.","grammar":"Purpose: pour + infinitive versus pour que + subjunctive with a new subject. Reference: R1. Finish with 3 personal examples.","reading":"Read a teacher-selected practical document on ‘Discuss transport choices’: an email, timetable, advert, form or short proposal. Find the purpose, constraints and required action. Use fictional personal details.","listening":"Reuse Clip A. Listen without text, take 5 notes, then repeat 30–60 seconds aloud and give a 1-minute summary. Spend the block improving understanding, not finding a new video.","teacher":"Compare transport options using a fictional timetable, not unverified real schedules. Use the 60-minute lesson structure in the Tutor guide.","writing":"Draft a 200–250-word message/story/opinion connected to today’s situation. Stop after 25 minutes and finish the draft in tomorrow’s block if needed. Send it for correction.","review":"Review target sets from Days 64, 58, 51. Retrieve before looking. Say the French aloud and use difficult items in a new sentence."},{"id":66,"week":10,"dayName":"Wednesday","minutes":180,"phase":"Month 3 - B2 development","title":"Plan a shared activity","phraseText":"1. organiser une collecte — to organise a collection\n2. répartir les tâches — to distribute tasks\n3. un bénévole  + 25 writing minutes; keep 5 minutes of reading and the 3-hour day total.","review":"Review target sets from Days 67, 65, 61, 54, 38. Retrieve before looking. Say the French aloud and use difficult items in a new sentence."},{"id":69,"week":10,"dayName":"Saturday","minutes":180,"phase":"Month 3 - B2 development","title":"Consolidation and transfer","phraseText":"No new vocabulary targets. Retrieve this week’s phrases and previously difficult items; explain any forgotten word without translating it.","frameText":"Reuse 3–5 connectors naturally. Make 3 new sentences with earlier sentence frames. Do not force a connector into every sentence.","grammar":"20-minute mixed retrieval quiz on this week’s grammar and your recurring errors. Correct, explain and produce a new example.","reading":"Read one UNSEEN text at your current level, selected by the teacher. Answer comprehension questions before looking up words. Time-box to 20 minutes.","listening":"Unseen listening chosen by the teacher, with questions. Follow the agreed number of listens. Keep this separate from repeatedly practised clips; record the result.","teacher":"Combine two of the week’s situations. Round 1 with brief notes; Round 2 without notes; Round 3 with an unexpected complication. Use 60 minutes including feedback.","writing":"Finish/revise Friday’s text, compare with your first draft and log 3 recurring errors. Record a 3–5 minute weekly summary using old vocabulary.","review":"Review target sets from Days 68, 66, 39. Retrieve before looking. Say the French aloud and use difficult items in a new sentence."},{"id":70,"week":10,"dayName":"Sunday","minutes":90,"phase":"Month 3 - B2 development","title":"Light review and enjoyable conversation","phraseText":"No new vocabulary targets. Retrieve this week’s phrases and previously difficult items; explain any forgotten word without translating it.","frameText":"Reuse 3–5 connectors naturally. Make 3 new sentences with earlier sentence frames. Do not force a c  author’s point and compare it with your first source. Use R5 or teacher-selected material.","listening":"Reuse Clip B. Work on one difficult 30–60 second passage. Check word boundaries, imitate the rhythm, and retell the message without the transcript.","teacher":"Explain what a supplied article claims and what support it gives. Do not invent evidence. Use the 60-minute lesson structure in the Tutor guide.","writing":"Write a short response on ‘Separate claims from evidence’ using a position, reason and example. Record a 2-minute version without reading.","review":"Review target sets from Days 73, 71, 67, 60, 44. Retrieve before looking. Say the French aloud and use difficult items in a new sentence."},{"id":75,"week":11,"dayName":"Friday","minutes":180,"phase":"Month 3 - B2 development","title":"Report a discussion","phraseText":"1. rapporter une conversation — to report a conversation\n2. exprimer un désaccord — to express disagreement\n3. un malentendu — a misunderstanding\n4. préciser sa pensée — to clarify one’s thinking\n5. un compte rendu — a report / summary\n6. retenir l’essentiel — to retain the main points","frameText":"7. autrement dit — in other words\n8. Si je comprends bien, vous voulez dire que…\nUse known items again; only create new flashcards for genuinely unfamiliar language.","grammar":"No separate grammar block today: transfer these 20 minutes to the 60-minute writing task. Apply this week’s grammar in the text.","reading":"Timed-writing day: read for 5 minutes only. Inspect one short model on the week’s theme supplied by your teacher; notice paragraph structure, then close it.","listening":"Clip C: a fresh R2 clip (5–8-minute excerpt) chosen for today’s role-play; later use R3/R4 if accessible. Identify viewpoint, supporting examples and 3 useful phrases.","teacher":"Report a disagreement between two fictional colleagues and clarify a misunderstanding. Use the 60-minute lesson structure in the Tutor guide.","writing":"Write 200–250 words on t ’s inputs."},{"week":14,"phase":"Month 4 - Consolidation","theme":"Formal communication and persuasion","grammar":"Register; gerund; pronoun order; precise linking","goals":"Monday: Write a formal request\nTuesday: Explain a service problem\nWednesday: Propose a solution\nThursday: Negotiate professionally\nFriday: Summarise an agreement","checkpoint":"Saturday: combine two situations; Sunday: light review and choose next week’s inputs."},{"week":15,"phase":"Month 4 - Consolidation","theme":"Unfamiliar topics and first B2-oriented assessment","grammar":"Consolidate weak structures; paraphrase and organise extended responses","goals":"Monday: Understand a new topic\nTuesday: Compare arguments\nWednesday: Discuss uncertainty\nThursday: Complete an unseen writing task\nFriday: Prepare an extended discussion","checkpoint":"Formal teacher checkpoint using fresh material."},{"week":16,"phase":"Month 4 - Consolidation","theme":"Targeted revision and final assessment","grammar":"Automate useful structures; repair individual errors; no grammar cramming","goals":"Monday: Repair your main error pattern\nTuesday: Transfer vocabulary to a new situation\nWednesday: Practise spontaneous interaction\nThursday: Complete a second unseen writing task\nFriday: Consolidate your strongest work","checkpoint":"Formal teacher checkpoint using fresh material."}],"resources":[{"id":"R1","name":"Tex’s French Grammar — University of Texas","use":"Grammar explanations and exercises","url":"https://www.laits.utexas.edu/tex/gr/index.html","note":"Open the section matching the day’s grammar target. Study one rule, then produce your own examples."},{"id":"R2","name":"TV5MONDE — Apprendre / EDU","use":"Levelled video exercises","url":"https://apprendre.tv5monde.com/fr","note":"Use A2 initially. Select three short clips per week with your teacher. TV5MONDE’s publisher description confirms A1–B2 activities, French subtitles and transcripts. Site access may vary."},{"id":"R2a","name":"TV5MONDE publisher description","use":"Verification of video levels and transcripts","url":"https://apps.apple.com/ga/app/tv5monde-edu-apprendre/id1482250598","note":"Publisher-owned app description; you do not need to buy an app to follow this plan."},{"id":"R3","name":"innerFrench podcast archive","use":"Intermediate listening","url":"https://innerfrench.com/podcast/","note":"From approximately Week 9, if comfortable. Start with older episodes, as the archive says episodes become progressively harder. Work on an excerpt, not necessarily a whole episode."},{"id":"R4","name":"RFI — Journal en français facile","use":"News listening with a transcript","url":"https://francaisfacile.rfi.fr/fr/podcasts/journal-en-fran%C3%A7ais-facile/","note":"From approximately Week 5, use only an accessible 2–3 minute section initially. RFI’s own podcast listing confirms transcripts. The RFI site blocks automated access."},{"id":"R4a","name":"RFI publisher podcast listing","use":"Verification of the programme and transcripts","url":"https://podcasts.apple.com/hn/podcast/journal-en-fran%C3%A7ais-facile/id1573764973","note":"Publisher feed description; no need to subscribe to a paid service."},{"id":"R5","name":"Lingua — French reading library","use":"Short level-labelled reading texts","url":"https://lingua.com/french/reading/","note":"Choose texts without the PREMIUM label. Use written texts and comprehension questions; audio may require Premium and is not assumed in this plan."},{"id":"R6","name":"Europass — CEFR self-assessment grid","use":"Separate listening, reading, interaction, production and writing benchmarks","url":"https://europass.europa.eu/en/common-european-framework-reference-language-skills","note":"Teacher uses the descriptors at Weeks 1, 4, 8, 12 and 16. The schedule and internal targets are not official CEFR scoring rules."},{"id":"R7","name":"Lingua — C’est ma vie","use":"Week 1 Monday reading","url":"https://lingua.com/french/reading/vie/","note":"Read for the speaker, family/work references and reasons. Then introduce your own life without copying."},{"id":"R8","name":"Lingua — La routine quotidienne","use":"Week 1 Tuesday reading","url":"https://lingua.com/french/reading/routine-quotidienne/","note":"Identify actions and time expressions. Retell using your own routine; ask your teacher about anything that appears inconsistent."},{"id":"R9","name":"Lingua — La lettre","use":"Week 1 Wednesday reading","url":"https://lingua.com/french/reading/la-lettre/","note":"Notice the greeting, purpose and ending. This is an informal personal letter, not a model formal complaint."},{"id":"R10","name":"Lingua — Jours de la semaine","use":"Week 1 Thursday reading","url":"https://lingua.com/french/reading/jours/","note":"Identify days, activities and sequencing; compare the structure with your own week."},{"id":"R11","name":"Lingua — Une conversation téléphonique","use":"Week 1 Friday reading","url":"https://lingua.com/french/reading/conservation-telephonique/","note":"Notice questions, replies and follow-ups. The spelling in this URL is the publisher’s actual address."},{"id":"R12","name":"Lingua — Les métiers","use":"Work and past-habit reading","url":"https://lingua.com/french/reading/les-metiers/","note":"Suitable as a work-related text for Weeks 4 or 8. Identify past habits and present circumstances."},{"id":"R13","name":"Lingua — Projets pour les vacances","use":"Week 5 travel-plan reading","url":"https://lingua.com/french/reading/projets-pour-les-vacances/","note":"Read the dialogue, then adapt it to a fictional trip of your own."},{"id":"R14","name":"Tex’s French Grammar — coordinating conjunctions","use":"Linking ideas","url":"https://www.laits.utexas.edu/tex/gr/con2.html","note":"Reference for common coordinating links; original practice sentences in this workbook are not copied from the source."},{"id":"R15","name":"Tex’s French Grammar — subordinating conjunctions","use":"Connecting clauses","url":"https://www.laits.utexas.edu/tex/gr/con3.html","note":"Reference for links between clauses. Check the required structure or mood with your teacher."}],"tutor":["TUTOR GUIDE • THE DAILY 60-MINUTE LESSON","Primary aim: turn learned language into independent interaction. Do not spend the whole hour chatting without feedback or explaining grammar while the learner listens.","5 MINUTES • WARM-UP RETRIEVAL","Ask yesterday’s questions differently. Elicit old phrases without showing the vocabulary list.","10 MINUTES • TARGETED CORRECTION","Correct 2–3 recurring errors and practise today’s structure in meaningful sentences.","25 MINUTES • SITUATION PRACTICE","Round 1: brief notes. Round 2: no script. Round 3: change a condition or add an objection. Require follow-up questions and clarification.","10 MINUTES • INPUT DISCUSSION","Learner summarises the reading/audio in their own words, gives a reaction and answers follow-ups.","5 MINUTES • PRONUNCIATION","Choose one intelligibility issue from actual speech. Model, contrast, repeat and reuse in a sentence.","5 MINUTES • FEEDBACK AND NEXT TASK","Record 3 corrections, 2 useful expressions and 1 target for tomorrow. Confirm the next text/clip.","FIRST LESSON AND WEEKLY MATERIAL SELECTION","First lesson: assess an unprepared personal introduction, a past-event account, a practical role-play and a short unseen audio. Writing alone cannot establish the learner’s listening or speaking level.","On Sundays, select three clips and the coming week’s readings. Prefer one theme across input and output. Match the working level, not merely the calendar phase. First-week reading links are supplied; later practical documents/models are to be selected or written by the teacher.","Choose audio/video with a usable French transcript or subtitles. Start with 1–3 minute excerpts. If understanding is too low to state the gist after two listens, shorten or simplify the input rather than translating every sentence.","FEEDBACK AND ASSESSMENT","Keep one shared error log: original sentence → corrected sentence → short explanation → a fresh learner example. Revisit the correction tomorrow and a week later. If multiple teachers are involved, they should use the same log and weekly target.","At checkpoints, rate task completion, intelligibility, interaction, sentence connection, vocabulary control and grammar against the relevant CEFR descriptors (R6). Keep listening, reading, spoken interaction, spoken production and writing results separate.","Week 4 target: a clear request and a connected past story. Week 8 target: independent familiar-topic interaction and a reasoned short text. Week 12 target: a structured viewpoint and response to objections. Week 16: fresh evidence across all four skills. These are teaching goals, not promised outcomes.","On checkpoint days, use the existing study blocks for assessment and the lesson for speaking/feedback. A full examination-style mock may need the blocks pooled across two days; never claim an official full mock fits an hour.","READY-TO-SEND BRIEF IN FRENCH","Mon objectif est de consolider mon niveau A2, d’atteindre un niveau B1 solide et de travailler vers le B2. Je souhaite pratiquer des situations concrètes, construire des phrases plus précises et réutiliser mon vocabulaire. Merci de corriger quelques erreurs récurrentes, de me faire reformuler et de refaire les jeux de rôle sans texte préparé. J’aimerais aussi évaluer séparément ma compréhension orale et mon expression orale au début, puis faire un bilan régulier."],"packs":{"1":{"title":"Une nouvelle collègue","text":"Bonjour, je m’appelle Camille. Je travaille dans une petite entreprise et je m’occupe des demandes des clients. Le matin, je réponds aux messages. L’après-midi, je participe aux réunions avec mon équipe. J’aime mon travail, mais je voudrais communiquer plus facilement avec mes collègues francophones. Je prends donc des cours de français avec une professeure. Nous travaillons ensemble une heure par jour. Mon objectif n’est pas de parler sans aucune erreur : je veux surtout comprendre les autres et expliquer mes idées. Après le cours, je relis mes notes et j’écris quelques phrases. Le week-end, je regarde une série en français. Je ne comprends pas tout, mais je progresse petit à petit.","questions":["De quoi Camille s’occupe-t-elle ?","Pourquoi prend-elle des cours ?","Que fait-elle après le cours ?"],"answers":["Elle s’occupe des demandes des clients.","Elle veut mieux communiquer avec ses collègues francophones.","Elle relit ses notes et écrit quelques phrases."],"audio":"— Bonjour ! Vous êtes notre nouvelle collègue ?\n— Oui, je m’appelle Camille. Je m’occupe des demandes des clients.\n— Vous parlez français ?\n— Un peu. Je prends des cours pour progresser.\n— Quel est votre objectif ?\n— Je voudrais participer plus facilement aux réunions.","turns":["Présentez-vous à votre nouvelle collègue.","De quoi vous occupez-vous au travail ?","Pourquoi apprenez-vous le français ?","Votre collègue parle trop vite. Demandez-lui de répéter."]},"2":{"title":"Une journée bien organisée","text":"Je commence à travailler à neuf heures, mais je me lève à sept heures. D’abord, je prépare mon petit-déjeuner. Ensuite, je prends le métro. Je préfère arriver un peu tôt pour ne pas être en retard. À midi, je prends une pause avec une collègue. Nous parlons de nos projets et nous mangeons près du bureau. Je finis normalement à dix-sept heures, puis je rentre chez moi. Deux fois par semaine, j’ai un cours de français en fin de journée. Mon emploi du temps est assez chargé. Aujourd’hui, mon responsable propose une réunion à dix-huit heures. Je ne suis pas disponible à cette heure-là, alors je propose demain matin. Il accepte, et je note le rendez-vous dans mon agenda.","questions":["À quelle heure cette personne commence-t-elle à travailler ?","Pourquoi préfère-t-elle arriver tôt ?","Quelle solution propose-t-elle pour la réunion ?"],"answers":["Elle commence à neuf heures.","Elle ne veut pas être en retard.","Elle propose de faire la réunion demain matin."],"audio":"— Est-ce que tu es disponible à dix-huit heures ?\n— Désolé, j’ai un cours de français.\n— Et demain à neuf heures ?\n— Je commence à travailler à neuf heures. Neuf heures trente, c’est possible ?\n— Oui, cela me convient.\n— Très bien, je note notre rendez-vous.","turns":["Décrivez une journée habituelle.","Votre collègue propose une réunion pendant votre cours. Répondez.","Proposez deux autres créneaux.","Votre collègue ne peut pas venir le matin. Trouvez une autre solution."]},"3":{"title":"Un changement de cours","text":"Bonjour Madame, je vous écris pour demander un changement d’horaire pour mon cours de français. Je ne peux plus venir au cours de dix-huit heures, car mon emploi du temps a changé. Je dois maintenant m’occuper de clients aux États-Unis et rester disponible plus tard le soir. Je voudrais continuer les cours avec votre école. Est-il possible de rejoindre un groupe le matin ou le samedi ? Je suis libre le mardi avant dix heures et le samedi après neuf heures. Je comprends que les places sont limitées. Si ces horaires ne sont pas possibles, pourriez-vous me proposer une autre solution ? Merci d’avance pour votre aide. Je vous souhaite une bonne journée. Cordialement, Alex.","questions":["Pourquoi Alex ne peut-il plus venir à dix-huit heures ?","Quels créneaux propose-t-il ?","Que demande-t-il si ces créneaux sont impossibles ?"],"answers":["Il a de nouvelles responsabilités et doit être disponible plus tard le soir.","Le mardi avant dix heures ou le samedi après neuf heures.","Il demande à l’école de proposer une autre solution."],"audio":"— Bonjour, je voudrais changer l’horaire de mon cours.\n— Quel cours suivez-vous ?\n— Le cours de dix-huit heures. Je ne peux plus venir le soir.\n— Il reste une place le samedi à dix heures.\n— Cela me convient. Est-ce que je peux commencer cette semaine ?\n— Oui, je vous envoie une confirmation.","turns":["Expliquez pourquoi vous appelez l’école.","Pourquoi ne pouvez-vous plus venir à dix-huit heures ?","L’école propose samedi. Confirmez ou proposez une alternative.","Le groupe du samedi est complet. Demandez une autre solution."]},"4":{"title":"De nouvelles responsabilités","text":"Depuis cette semaine, Léa s’occupe aussi des clients aux États-Unis. Avant, elle terminait souvent sa journée à dix-sept heures. Maintenant, elle doit parfois répondre aux demandes jusqu’à dix-neuf heures. Elle aime ses nouvelles responsabilités, mais elle veut garder du temps pour ses cours de français. Elle parle donc de son emploi du temps avec son responsable. Ils décident qu’elle peut commencer plus tard deux jours par semaine. Les autres jours, une collègue répond aux messages en fin de journée. Léa prépare aussi une liste des tâches prioritaires. Elle ne peut pas tout faire en même temps. Cette nouvelle organisation lui permet de continuer à apprendre le français et de mieux aider les clients.","questions":["Quelle nouvelle responsabilité Léa a-t-elle ?","Avec qui parle-t-elle de son emploi du temps ?","Comment l’équipe partage-t-elle le travail en fin de journée ?"],"answers":["Elle s’occupe aussi des clients aux États-Unis.","Elle en parle avec son responsable.","Une collègue répond aux messages certains jours."],"audio":"— Tu as de nouvelles responsabilités ?\n— Oui, je m’occupe aussi des clients aux États-Unis.\n— Tu dois finir plus tard ?\n— Parfois. Je voudrais organiser mes horaires autrement.\n— Quelle solution proposes-tu ?\n— Je pourrais commencer plus tard deux jours par semaine.","turns":["Expliquez vos nouvelles responsabilités.","Que devez-vous changer dans votre emploi du temps ?","Proposez une répartition des tâches.","Une collègue est absente. Proposez une solution temporaire."]},"5":{"title":"La confirmation","text":"Bonjour Alex, nous avons bien reçu votre demande de changement d’horaire. Une place est disponible dans le groupe du samedi matin, de dix heures à onze heures. Le cours commence la semaine prochaine et se déroule dans la salle douze, au deuxième étage. Votre professeure s’appelle Claire. Pour confirmer votre inscription, merci de répondre à ce message avant jeudi. Vous pouvez garder votre livre actuel. Apportez aussi un cahier et un stylo. Si vous avez un empêchement, prévenez le secrétariat dès que possible. Nous pouvons vous envoyer les exercices, mais nous ne pouvons pas garantir un cours de remplacement. Nous espérons que ce nouvel horaire vous conviendra. À bientôt, Le secrétariat de l’école.","questions":["Quand a lieu le nouveau cours ?","Comment Alex doit-il confirmer son inscription ?","Que doit-il faire s’il ne peut pas venir ?"],"answers":["Le samedi de dix heures à onze heures, à partir de la semaine prochaine.","Il doit répondre au message avant jeudi.","Il doit prévenir le secrétariat dès que possible."],"audio":"— Bonjour, je voudrais confirmer mon nouveau cours.\n— C’est bien le samedi à dix heures ?\n— Oui. Dans quelle salle a-t-il lieu ?\n— Dans la salle douze, au deuxième étage.\n— Dois-je acheter un nouveau livre ?\n— Non, vous pouvez garder votre livre actuel.","turns":["Confirmez le jour et l’heure du cours.","Demandez où se trouve la salle.","Posez une question sur le matériel.","Vous serez absent une semaine. Demandez comment récupérer les exercices."]},"6":{"title":"Deux rendez-vous le même jour","text":"Samira vient de commencer un nouveau travail. Elle veut aussi continuer son cours de français du jeudi soir. Un matin, son responsable lui demande de participer à une réunion jeudi à dix-huit heures. C’est exactement l’heure de son cours. Au lieu d’annuler immédiatement, elle cherche une solution. Elle explique la situation et propose de faire la réunion une heure plus tôt. Son responsable n’est pas disponible à dix-sept heures, mais il peut la faire vendredi matin. Samira accepte et confirme l’horaire par message. Ensuite, elle vérifie son agenda pour la semaine suivante. Elle décide de noter ses cours à l’avance afin d’éviter le même problème. Elle est contente d’avoir posé la question plutôt que d’avoir abandonné son cours.","questions":["Quel est le problème de Samira ?","Pourquoi sa première proposition ne fonctionne-t-elle pas ?","Quelle solution trouvent-ils finalement ?"],"answers":["Sa réunion et son cours sont prévus à la même heure.","Son responsable n’est pas disponible à dix-sept heures.","Ils décident de faire la réunion vendredi matin."],"audio":"— J’ai un cours jeudi à dix-huit heures. Peut-on avancer la réunion ?\n— À quelle heure ?\n— À dix-sept heures, par exemple.\n— Je ne suis pas disponible. Vendredi matin, c’est possible ?\n— Oui, vendredi à neuf heures me convient.\n— Parfait, je change l’invitation.","turns":["Expliquez deux engagements qui se chevauchent.","Proposez un premier changement.","Votre première proposition est refusée. Réagissez.","Confirmez l’accord en reformulant le jour et l’heure."]},"7":{"title":"Un dimanche tranquille","text":"Le dimanche, je préfère apprendre le français sans programme chargé. Je prends mon petit-déjeuner et je lis quelques pages d’un livre facile. Si je ne comprends pas un mot, je continue parfois sans chercher sa traduction. Plus tard, je retrouve un ami pour parler de notre semaine. Nous discutons de nos sorties, de notre travail et de nos projets. L’après-midi, je regarde un petit extrait d’une émission en français. Je choisis quelque chose qui m’intéresse, même si ce n’est pas lié à mon cours. Avant le dîner, je prépare ma semaine avec ma professeure. Nous choisissons trois vidéos courtes et quelques textes. Je termine la journée avec l’impression d’avoir pratiqué, mais aussi d’avoir pris une pause.","questions":["Comment cette personne pratique-t-elle le français le matin ?","De quoi parle-t-elle avec son ami ?","Que prépare-t-elle avec sa professeure ?"],"answers":["Elle lit quelques pages d’un livre facile.","Ils parlent de leur semaine, de leurs sorties, de leur travail et de leurs projets.","Elle choisit les vidéos et les textes de la semaine suivante."],"audio":"— Qu’est-ce que tu as aimé cette semaine ?\n— J’ai réussi à demander un autre horaire en français.\n— C’était difficile ?\n— Un peu, mais j’ai trouvé une solution.\n— Qu’est-ce que tu veux pratiquer la semaine prochaine ?\n— Je voudrais commander au restaurant et poser des questions.","turns":["Racontez un moment agréable de la semaine.","Quelle expression vous a été utile ?","Posez une question sur les loisirs de votre partenaire.","Choisissez un sujet qui vous intéresse pour la semaine prochaine."]}},"drills":[{"title":"Present tense & complete sentences","items":[{"id":"g1-1","prompt":"Complete: ___ vous écris pour demander un changement.","answer":"Je","explain":"Je vous écris is useful when addressing someone. There is no elision before vous.","accept":["Je"]},{"id":"g1-2","prompt":"Correct: Je écris cette message.","answer":"J’écris ce message.","explain":"Je becomes j’ before écris; message is masculine.","accept":["J’écris ce message."]},{"id":"g1-3","prompt":"Complete: Je suis responsable ___ clients.","answer":"des","explain":"Responsable de + les clients becomes responsable des clients.","accept":["des"]},{"id":"g1-4","prompt":"Correct: Je regarde la télévision et écouter la musique.","answer":"Je regarde la télévision et j’écoute la musique.","explain":"Give each action a conjugated verb.","accept":["Je regarde la télévision et j’écoute la musique."]},{"id":"g1-5","prompt":"Make negative: Je peux venir demain.","answer":"Je ne peux pas venir demain.","explain":"Place ne and pas around peux.","accept":["Je ne peux pas venir demain."]},{"id":"g1-6","prompt":"Join with parce que: Je ne peux pas venir. Je travaille.","answer":"Je ne peux pas venir parce que je travaille.","explain":"Parce que introduces a reason with a subject and conjugated verb.","accept":["Je ne peux pas venir parce que je travaille."]}]},{"title":"Articles, quantities & questions","items":[{"id":"g2-1","prompt":"Complete: Je voudrais ___ eau, s’il vous plaît.","answer":"de l’","explain":"Use de l’ before the vowel in eau.","accept":["de l’"]},{"id":"g2-2","prompt":"Complete: Je ne bois pas ___ café.","answer":"de","explain":"After this negation, du becomes de.","accept":["de"]},{"id":"g2-3","prompt":"Complete: Il me faut un kilo ___ pommes.","answer":"de","explain":"Use de after a quantity.","accept":["de"]},{"id":"g2-4","prompt":"Ask with est-ce que: Vous avez ce modèle.","answer":"Est-ce que vous avez ce modèle ?","explain":"Est-ce que introduces the question; keep normal subject–verb order.","accept":["Est-ce que vous avez ce modèle ?"]},{"id":"g2-5","prompt":"Complete: Ce pantalon est plus cher ___ celui-ci.","answer":"que","explain":"A comparison uses plus … que.","accept":["que"]},{"id":"g2-6","prompt":"Complete: Je voudrais ___ pain. (some)","answer":"du","explain":"Use du with the masculine noun pain here.","accept":["du"]}]},{"title":"Passé composé","items":[{"id":"g3-1","prompt":"Correct: Je suis visité un musée.","answer":"J’ai visité un musée.","explain":"Visiter takes avoir in this construction.","accept":["J’ai visité un musée."]},{"id":"g3-2","prompt":"Complete: Hier, nous ___ le train. (prendre)","answer":"avons pris","explain":"Prendre has the past participle pris.","accept":["avons pris"]},{"id":"g3-3","prompt":"Complete: Marie ___ à neuf heures. (arriver)","answer":"est arrivée","explain":"Arriver uses être; arrivée agrees with Marie.","accept":["est arrivée"]},{"id":"g3-4","prompt":"Complete: Ils ___ au cinéma. (aller)","answer":"sont allés","explain":"Aller uses être; the participle agrees with ils.","accept":["sont allés"]},{"id":"g3-5","prompt":"Complete: J’___ mes amis. (retrouver)","answer":"ai retrouvé","explain":"Retrouver takes avoir.","accept":["ai retrouvé"]},{"id":"g3-6","prompt":"Make negative: J’ai compris.","answer":"Je n’ai pas compris.","explain":"The negation surrounds the auxiliary ai.","accept":["Je n’ai pas compris."]}]},{"title":"Imparfait & past storytelling","items":[{"id":"g4-1","prompt":"Complete: À cette époque, nous ___ à la campagne. (vivre)","answer":"vivions","explain":"Use the imperfect for the background situation.","accept":["vivions"]},{"id":"g4-2","prompt":"Complete: Quand j’étais petit, je ___ au parc chaque dimanche. (jouer)","answer":"jouais","explain":"The imperfect describes a recurring past habit.","accept":["jouais"]},{"id":"g4-3","prompt":"Complete: Il ___ quand je suis sorti. (pleuvoir)","answer":"pleuvait","explain":"The imperfect describes the background weather.","accept":["pleuvait"]},{"id":"g4-4","prompt":"Complete: Hier, j’___ un musée. (visiter)","answer":"ai visité","explain":"This completed visit is narrated in the passé composé.","accept":["ai visité"]},{"id":"g4-5","prompt":"Complete: Avant, vous ___ plus tôt. (finir)","answer":"finissiez","explain":"The imperfect stem is finiss-.","accept":["finissiez"]},{"id":"g4-6","prompt":"Complete: Nous ___ très contents. (être, imparfait)","answer":"étions","explain":"Être uses the imperfect stem ét-.","accept":["étions"]}]},{"title":"Future plans","items":[{"id":"g5-1","prompt":"Complete: Demain, je ___ étudier. (aller, présent)","answer":"vais","explain":"Aller in the present + infinitive expresses a planned future action.","accept":["vais"]},{"id":"g5-2","prompt":"Complete: La semaine prochaine, nous ___ à Lyon. (aller, futur simple)","answer":"irons","explain":"The future stem of aller is ir-.","accept":["irons"]},{"id":"g5-3","prompt":"Complete: Si j’ai le temps, je ___. (venir, futur simple)","answer":"viendrai","explain":"Here, si + present is followed by a future result.","accept":["viendrai"]},{"id":"g5-4","prompt":"Complete: Vous ___ une confirmation demain. (recevoir, futur simple)","answer":"recevrez","explain":"The future stem of recevoir is recevr-.","accept":["recevrez"]},{"id":"g5-5","prompt":"Complete: Je ___ disponible vendredi. (être, futur simple)","answer":"serai","explain":"Être has the future stem ser-.","accept":["serai"]},{"id":"g5-6","prompt":"Complete: Ils ___ le nécessaire. (faire, futur simple)","answer":"feront","explain":"Faire has the future stem fer-.","accept":["feront"]}]},{"title":"Polite requests & pronouns","items":[{"id":"g6-1","prompt":"Complete: Je ___ changer d’horaire. (vouloir, conditionnel)","answer":"voudrais","explain":"Je voudrais is a polite request.","accept":["voudrais"]},{"id":"g6-2","prompt":"Complete: ___-vous répéter ? (pouvoir, conditionnel)","answer":"Pourriez","explain":"Pourriez-vous is a polite question.","accept":["Pourriez"]},{"id":"g6-3","prompt":"Replace à Lyon: J’habite à Lyon.","answer":"J’y habite.","explain":"Y replaces this place introduced by à.","accept":["J’y habite."]},{"id":"g6-4","prompt":"Replace du café: Je veux du café.","answer":"J’en veux.","explain":"En replaces the quantity phrase du café.","accept":["J’en veux."]},{"id":"g6-5","prompt":"Replace à Marie: Je téléphone à Marie.","answer":"Je lui téléphone.","explain":"Lui replaces the indirect object à Marie.","accept":["Je lui téléphone."]},{"id":"g6-6","prompt":"Replace le message: Je lis le message.","answer":"Je le lis.","explain":"Le replaces this direct object before the verb.","accept":["Je le lis."]}]},{"title":"Relative pronouns & advice","items":[{"id":"g7-1","prompt":"Complete: C’est le livre ___ je t’ai parlé.","answer":"dont","explain":"Parler de → dont.","accept":["dont"]},{"id":"g7-2","prompt":"Complete: C’est une activité ___ me plaît.","answer":"qui","explain":"Qui is the subject of plaît.","accept":["qui"]},{"id":"g7-3","prompt":"Complete: Voici le cours ___ je préfère.","answer":"que","explain":"Que is the direct object of préfère.","accept":["que"]},{"id":"g7-4","prompt":"Complete: C’est la ville ___ j’habite.","answer":"où","explain":"Où introduces the place where you live.","accept":["où"]},{"id":"g7-5","prompt":"Give advice with vous: prendre une pause.","answer":"Prenez une pause.","explain":"The imperative omits the subject pronoun.","accept":["Prenez une pause."]},{"id":"g7-6","prompt":"Complete: Cette activité est moins chère ___ l’autre.","answer":"que","explain":"A comparison uses moins … que.","accept":["que"]}]},{"title":"Sequence & plus-que-parfait","items":[{"id":"g8-1","prompt":"Complete the full verb phrase: Quand je suis arrivé, le cours ___. (déjà commencer, plus-que-parfait)","answer":"avait déjà commencé","explain":"Plus-que-parfait: imperfect auxiliary + past participle.","accept":["avait déjà commencé"]},{"id":"g8-2","prompt":"Complete: Elle ___ avant mon appel. (partir, plus-que-parfait)","answer":"était partie","explain":"Partir uses être; partie agrees with elle.","accept":["était partie"]},{"id":"g8-3","prompt":"Complete: Nous ___ le projet avant la réunion. (finir, plus-que-parfait)","answer":"avions fini","explain":"This is an event completed before another past moment.","accept":["avions fini"]},{"id":"g8-4","prompt":"Complete: J’___ ce problème auparavant. (rencontrer, plus-que-parfait)","answer":"avais rencontré","explain":"Use avais + past participle.","accept":["avais rencontré"]},{"id":"g8-5","prompt":"Complete: Ils ___ leur travail. (préparer, plus-que-parfait)","answer":"avaient préparé","explain":"Avaient is the imperfect of avoir with ils.","accept":["avaient préparé"]},{"id":"g8-6","prompt":"Complete: Après cela, nous ___ la solution. (présenter, passé composé)","answer":"avons présenté","explain":"The passé composé moves the story forward.","accept":["avons présenté"]}]},{"title":"Hypothetical situations","items":[{"id":"g9-1","prompt":"Complete: Si j’avais plus de temps, je ___. (voyager)","answer":"voyagerais","explain":"Si + imperfect → conditional for this hypothesis.","accept":["voyagerais"]},{"id":"g9-2","prompt":"Complete: Si nous ___ le choix, nous resterions. (avoir)","answer":"avions","explain":"Use the imperfect in this si clause.","accept":["avions"]},{"id":"g9-3","prompt":"Complete: À votre place, je ___ cet outil. (choisir)","answer":"choisirais","explain":"The conditional expresses hypothetical advice.","accept":["choisirais"]},{"id":"g9-4","prompt":"Complete: Cela ___ utile. (être, conditionnel)","answer":"serait","explain":"The conditional stem of être is ser-.","accept":["serait"]},{"id":"g9-5","prompt":"Complete: Tu ___ essayer une autre solution. (pouvoir, conditionnel)","answer":"pourrais","explain":"Tu pourrais expresses a suggestion.","accept":["pourrais"]},{"id":"g9-6","prompt":"Complete: Si elle ___ mieux, elle participerait. (comprendre)","answer":"comprenait","explain":"Use the imperfect, not the conditional, in this si clause.","accept":["comprenait"]}]},{"title":"Present subjunctive","items":[{"id":"g10-1","prompt":"Complete: Il faut que tu ___ à l’heure. (être)","answer":"sois","explain":"Il faut que is followed by the subjunctive.","accept":["sois"]},{"id":"g10-2","prompt":"Complete: Je voudrais que vous ___ demain. (venir)","answer":"veniez","explain":"A wish concerning another person takes the subjunctive here.","accept":["veniez"]},{"id":"g10-3","prompt":"Complete: Il est important que nous ___ attention. (faire)","answer":"fassions","explain":"Faire has the subjunctive stem fass-.","accept":["fassions"]},{"id":"g10-4","prompt":"Complete: Pour que cela ___, il faut participer. (fonctionner)","answer":"fonctionne","explain":"Pour que introduces a purpose with the subjunctive.","accept":["fonctionne"]},{"id":"g10-5","prompt":"Complete: Je souhaite qu’elle ___ le temps. (avoir)","answer":"ait","explain":"Avoir: qu’elle ait.","accept":["ait"]},{"id":"g10-6","prompt":"Complete: Nous voulons qu’ils ___ nous aider. (pouvoir)","answer":"puissent","explain":"Pouvoir: qu’ils puissent.","accept":["puissent"]}]},{"title":"Reported speech","items":[{"id":"g11-1","prompt":"Complete: Elle dit : « Je suis prête. » → Elle dit qu’elle ___ prête.","answer":"est","explain":"With dit in the present, the reported statement stays in the present.","accept":["est"]},{"id":"g11-2","prompt":"Complete: Il a dit : « Je suis fatigué. » → Il a dit qu’il ___ fatigué.","answer":"était","explain":"In this past narrative, present shifts to imperfect.","accept":["était"]},{"id":"g11-3","prompt":"Complete: Elle demande : « Tu viens ? » → Elle demande ___ tu viens.","answer":"si","explain":"Report a yes/no question using si.","accept":["si"]},{"id":"g11-4","prompt":"Complete: Il demande : « Où habitez-vous ? » → Il demande où vous ___.","answer":"habitez","explain":"An indirect question uses subject–verb order.","accept":["habitez"]},{"id":"g11-5","prompt":"Complete: Elle a dit : « Je viendrai. » → Elle a dit qu’elle ___.","answer":"viendrait","explain":"A future viewed from a past reporting verb becomes the conditional.","accept":["viendrait"]},{"id":"g11-6","prompt":"Complete: Il me demande ___ partir. (to leave)","answer":"de","explain":"Demander à quelqu’un de faire quelque chose.","accept":["de"]}]},{"title":"Concession, cause & passive voice","items":[{"id":"g12-1","prompt":"Complete: ___ la pluie, nous sommes sortis. (despite)","answer":"Malgré","explain":"Malgré is followed by a noun phrase here.","accept":["Malgré"]},{"id":"g12-2","prompt":"Complete: Bien qu’il ___ tard, nous continuons. (être)","answer":"soit","explain":"Bien que takes the subjunctive.","accept":["soit"]},{"id":"g12-3","prompt":"Complete: Même s’il ___ tard, nous continuons. (être)","answer":"est","explain":"Même si takes the indicative here.","accept":["est"]},{"id":"g12-4","prompt":"Change to passive: L’équipe prépare le dossier.","answer":"Le dossier est préparé par l’équipe.","explain":"Passive: être + agreeing past participle.","accept":["Le dossier est préparé par l’équipe."]},{"id":"g12-5","prompt":"Complete: Les tâches sont ___. (répartir)","answer":"réparties","explain":"The past participle agrees with feminine plural tâches.","accept":["réparties"]},{"id":"g12-6","prompt":"Complete: Je suis occupé ; ___, je peux vous aider. (however)","answer":"cependant","explain":"Cependant introduces a contrasting statement.","accept":["cependant"]}]},{"title":"Conditional past & regrets","items":[{"id":"g13-1","prompt":"Complete: Si j’avais su, je ___. (venir)","answer":"serais venu","explain":"A model with a masculine speaker; serais venue is also accepted.","accept":["serais venu","serais venue"]},{"id":"g13-2","prompt":"Complete: Elle ___ une autre méthode. (choisir, conditionnel passé)","answer":"aurait choisi","explain":"Conditional auxiliary + past participle.","accept":["aurait choisi"]},{"id":"g13-3","prompt":"Complete: Si nous ___ le temps, nous serions restés. (avoir)","answer":"avions eu","explain":"Use the plus-que-parfait in this si clause.","accept":["avions eu"]},{"id":"g13-4","prompt":"Complete: J’___ pratiquer davantage. (devoir, conditionnel passé)","answer":"aurais dû","explain":"J’aurais dû expresses an unrealised obligation or regret.","accept":["aurais dû"]},{"id":"g13-5","prompt":"Complete: Ils ___ participer. (pouvoir, conditionnel passé)","answer":"auraient pu","explain":"Pouvoir has the past participle pu.","accept":["auraient pu"]},{"id":"g13-6","prompt":"Complete: Sans ce problème, elle ___ plus tôt. (arriver, conditionnel passé)","answer":"serait arrivée","explain":"Arriver uses être; arrivée agrees with elle.","accept":["serait arrivée"]}]},{"title":"Formal communication","items":[{"id":"g14-1","prompt":"Complete: Je vous remercie ___ votre aide.","answer":"pour","explain":"Je vous remercie pour votre aide is a polite closing; de is also accepted.","accept":["pour","de"]},{"id":"g14-2","prompt":"Complete: Je vous écris ___ demander un remboursement.","answer":"pour","explain":"Pour + infinitive expresses purpose.","accept":["pour"]},{"id":"g14-3","prompt":"Complete: Je souhaiterais ___ une autre solution. (proposer)","answer":"proposer","explain":"After souhaiterais, use the infinitive.","accept":["proposer"]},{"id":"g14-4","prompt":"Complete with the gerund: ___ régulièrement, on progresse. (pratiquer)","answer":"En pratiquant","explain":"The gerund uses en + present participle.","accept":["En pratiquant"]},{"id":"g14-5","prompt":"Replace le document and à Marie: Je donne le document à Marie.","answer":"Je le lui donne.","explain":"Le comes before lui in this pronoun combination.","accept":["Je le lui donne."]},{"id":"g14-6","prompt":"Complete: Dans l’attente de votre réponse, je vous ___ une bonne journée. (souhaiter)","answer":"souhaite","explain":"Use the present tense in this closing.","accept":["souhaite"]}]},{"title":"Mixed repair","items":[{"id":"g15-1","prompt":"Correct: Je suis visité le château.","answer":"J’ai visité le château.","explain":"Visiter takes avoir here.","accept":["J’ai visité le château."]},{"id":"g15-2","prompt":"Complete: C’est un sujet ___ nous parlons souvent.","answer":"dont","explain":"Parler de → dont.","accept":["dont"]},{"id":"g15-3","prompt":"Complete: Si j’étais disponible, je ___. (participer)","answer":"participerais","explain":"Use the conditional in the result clause.","accept":["participerais"]},{"id":"g15-4","prompt":"Complete: Il faut que nous ___ plus précis. (être)","answer":"soyons","explain":"Être: que nous soyons.","accept":["soyons"]},{"id":"g15-5","prompt":"Complete: Je ne peux plus venir, ___ je propose un autre horaire. (so)","answer":"donc","explain":"Donc introduces the consequence.","accept":["donc"]},{"id":"g15-6","prompt":"Complete: Avant de ___, vérifiez l’adresse. (partir)","answer":"partir","explain":"Avant de is followed by an infinitive.","accept":["partir"]}]},{"title":"Independent consolidation","items":[{"id":"g16-1","prompt":"Complete: Il est possible ___ changer de groupe.","answer":"de","explain":"Possible de + infinitive.","accept":["de"]},{"id":"g16-2","prompt":"Complete: Je ne suis pas d’accord, ___ je comprends votre point de vue. (but)","answer":"mais","explain":"Mais connects these contrasting statements.","accept":["mais"]},{"id":"g16-3","prompt":"Complete: Nous ___ le problème avant votre appel. (résoudre, plus-que-parfait)","answer":"avions résolu","explain":"Résoudre has the past participle résolu.","accept":["avions résolu"]},{"id":"g16-4","prompt":"Complete: Pourriez-vous me dire ___ se trouve la salle ?","answer":"où","explain":"Où asks about a location in this indirect question.","accept":["où"]},{"id":"g16-5","prompt":"Complete: Si j’avais mieux organisé mon temps, j’___ davantage. (pratiquer)","answer":"aurais pratiqué","explain":"Use conditional past for this unreal past result.","accept":["aurais pratiqué"]},{"id":"g16-6","prompt":"Complete: Je préfère ___ les deux méthodes. (combiner)","answer":"combiner","explain":"Préférer can be followed by an infinitive.","accept":["combiner"]}]}],"starterErrors":[{"original":"Je suis visité un musée.","corrected":"J’ai visité un musée.","rule":"Visiter uses avoir here.","example":"J’ai visité un château samedi.","category":"Past tense"},{"original":"Je commande un changement.","corrected":"Je demande un changement.","rule":"Demander means to request in this situation.","example":"Je voudrais demander un autre horaire.","category":"Vocabulary"},{"original":"Je écris cette message.","corrected":"J’écris ce message.","rule":"J’écris uses elision; message is masculine.","example":"Je vous écris au sujet de mon cours.","category":"Sentence building"}],"meta":{"title":"Parcours","version":"1.0.0","source":"French_16_Week_Daily_Plan.xlsx","scheduledPhraseEntries":480,"days":112,"preparedPacks":7,"note":"A2 writing consolidation, then B1 and a B2 stretch goal. Listening and speaking require a separate teacher assessment. No level guarantee."}};

 {id:'supereasy',title:'Super Easy French',subtitle:'Short videos with language support',kind:'show',provider:'Easy French · YouTube',levels:['A2','B1'],free:true,tags:['everyday life','routines','pronunciation','questions'],start:'Start now',excerpt:'2–4 minutes',description:'Start with the slower beginner videos, then try short street-interview extracts as your listening improves.',support:'Free videos with French and English subtitles. Focus on the French line, then replay without reading. Extra membership materials are optional.',url:'https://www.easy-languages.org/easy-french',starter:{name:'Super Easy French playlist',url:'https://www.youtube.com/playlist?list=PLA5UIoabheFMChKPAUUNNEOd7BobVJVoQ',type:'Choose a short video',note:'Pick a familiar everyday situation. This is a playlist, not one preselected episode; save your chosen title and timestamps in the listening log.'},method:'Try a short passage without reading the subtitles. Check the French line, copy the rhythm of two sentences, and answer the same question yourself.',questions:['What is the question or situation in this clip?','Which two expressions could you reuse this week?','Can you answer using a reason connected with parce que?'],source:'https://www.easy-languages.org/easy-french'},
 {id:'inner',title:'innerFrench',subtitle:'The archive · longer ideas in French',kind:'podcast',provider:'innerFrench',levels:['B1','B2'],free:true,tags:['culture','learning','opinions','society'],start:'Build toward B1',excerpt:'5–8 minutes to begin',description:'An intermediate listening archive. The publisher recommends starting with older episodes because later ones become more challenging.',support:'Audio and transcript links are available through the archive; transcript access may involve an account. The feed announced its final episode on 14 September 2026, so use this as an archive.',url:'https://innerfrench.com/podcast/',starter:{name:'Choose one of the earliest archive episodes',url:'https://innerfrench.com/podcast/',type:'Archive starting point',note:'Select an older episode on a familiar topic. Work on one short section, not the full episode, until you can summarise it.'},method:'Listen without the transcript first. Explain the main idea, then use the transcript to investigate the sentences you missed.',questions:['What is the speaker’s main idea?','Which example helps explain that idea?','Do you agree, and can you give your own example?'],source:'https://podcast.innerfrench.com/'},
 {id:'authentique',title:'Français Authentique',subtitle:'Personal stories and connected speech',kind:'podcast',provider:'Français Authentique',levels:['B1','B2'],free:true,tags:['travel','past tenses','stories','everyday life'],start:'Build toward B1',excerpt:'4–6 minutes to begin',description:'Use a personal-story episode to practise following events, reasons and reflections in connected French.',support:'The linked starter episode includes an audio link and a written transcript on the publisher’s page. Other courses and membership offers are separate.',url:'https://www.francaisauthentique.com/podcasts/',starter:{name:'10 jours dans le Jura',url:'https://www.francaisauthentique.com/10-jours-dans-le-jura/',type:'Specific episode',note:'Use the opening travel section. Note the reason for the destination choice and how the speaker connects events; stop before the recording becomes too long for your block.'},method:'Listen for actions versus background descriptions. Retell the section in three connected sentences, then describe your own recent weekend.',questions:['Why did the speaker choose this kind of holiday?','Which actions and background descriptions did you hear?','How would you tell a similar story about your own life?'],source:'https://www.francaisauthentique.com/10-jours-dans-le-jura/'},
 {id:'rfi',title:'Journal en français facile',subtitle:'Short news-listening practice',kind:'podcast',provider:'RFI',levels:['B1','B2'],free:true,tags:['news','summaries','dates','listening'],start:'Build toward B1',excerpt:'One 2–3-minute news item',description:'Choose one item from a bulletin and practise identifying the main event, essential details and unfamiliar vocabulary. A “facile” title does not mean beginner-level speech.',support:'RFI describes the programme as accompanied by transcripts on Le français facile avec RFI. Use the transcript link in the selected episode’s description.',url:'https://podcasts.apple.com/fr/podcast/journal-en-fran%C3%A7ais-facile/id1573764973',starter:{name:'One item from a bulletin you choose',url:'https://podcasts.apple.com/fr/podcast/journal-en-fran%C3%A7ais-facile/id1573764973',type:'Choose an episode',note:'Choose a topic you already understand in English. Follow the episode’s RFI transcript link. No particular news story has been assigned or endorsed.'},method:'Record the people or organisations mentioned, what happened and when. Separate what the speaker reports from any opinion attributed to someone.',questions:['What is the main event in one sentence?','Which two details are essential to understanding it?','What remains uncertain or unexplained in the report?'],source:'https://podcasts.apple.com/fr/podcast/journal-en-fran%C3%A7ais-facile/id1573764973'},
